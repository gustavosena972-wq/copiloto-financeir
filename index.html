<style>
:root{--bg:#0b0d14;--card:#141826;--card2:#1a1f31;--bd:#252b40;--tx:#eef0f8;--mu:#8f98b3;--ac:#7c83ff;--ac2:#a78bfa;--ok:#34d399;--no:#fb7185;--wa:#fbbf24}
*{box-sizing:border-box}
body{margin:0;color:var(--tx);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;background:radial-gradient(900px 500px at 10% -10%,#1c2150 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#2a1a4a 0,transparent 55%),var(--bg)}
button,input,select{font:inherit;color:inherit}
input,select{background:#0e1220;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;min-width:0;transition:.15s}
input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #7c83ff33}
button{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;color:#fff;transition:.15s}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
button.sec{background:#222842;color:var(--tx)}button.red{background:#3a1c28;color:#fda4af}

.wrap{max-width:1200px;margin:0 auto;padding:18px}
.brand{font-size:18px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;background:#10131f;border:1px solid var(--bd);border-radius:14px;padding:5px;width:fit-content;max-width:100%}
.tabs button{background:transparent;color:var(--mu)}.tabs button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff}
.meses{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.meses button{background:#171c2e;color:var(--mu);padding:7px 11px}.meses button.on{background:var(--ac);color:#fff}.meses button.fech{outline:1px solid var(--wa)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 8px 24px #0006}
.card small{color:var(--mu);display:block}.card b{font-size:21px}
.pos{color:var(--ok)}.neg{color:var(--no)}.mu{color:var(--mu)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:16px}
table{width:100%;border-collapse:collapse;min-width:860px}
th{color:var(--mu);font-weight:600;text-align:left;font-size:12px;padding:10px 8px;text-transform:uppercase;letter-spacing:.04em}
td{padding:5px 6px;border-top:1px solid var(--bd)}td input,td select{width:100%}
tbody tr:hover td{background:#171c2e}.novo td{background:#10142080!important}
tfoot td{font-weight:700;border-top:2px solid var(--bd)}
.auth{max-width:390px;margin:8vh auto;display:grid;gap:10px;background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--bd);border-radius:20px;padding:26px;box-shadow:0 20px 50px #0008}
.auth h1{margin:0;font-size:24px}
.sug{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.sug.corte{border-left-color:var(--ok)}.sug.alerta{border-left-color:var(--no)}.sug.dica{border-left-color:var(--wa)}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.chart{display:flex;gap:8px;margin-top:10px}.col{flex:1;text-align:center}
.bb{height:130px;display:flex;align-items:flex-end;justify-content:center;gap:3px}.bb i{width:38%;border-radius:5px 5px 0 0;min-height:2px;display:block}
.catrow{display:grid;grid-template-columns:130px 1fr 130px;gap:10px;align-items:center;margin:7px 0}
.track{background:#0e1220;border-radius:99px;height:9px;overflow:hidden}.track i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2))}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222842;border:1px solid var(--bd);padding:11px 16px;border-radius:12px;display:none;max-width:90vw;z-index:9;box-shadow:0 10px 30px #0008}
#toast.err{border-color:var(--no)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.anim .card,.anim .sug,.anim .scroll{animation:up .5s both}.anim .cards .card:nth-child(2){animation-delay:.06s}.anim .cards .card:nth-child(3){animation-delay:.12s}.anim .cards .card:nth-child(4){animation-delay:.18s}.anim .cards .card:nth-child(n+5){animation-delay:.24s}
.ring{display:flex;align-items:center;gap:12px}.ring svg{transform:rotate(-90deg);flex:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-weight:500;padding:6px 10px;font-size:12.5px}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:8;padding:14px}.box{max-width:560px;width:100%}
textarea{background:#0e1220;border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font:inherit;color:inherit}
.card{background:rgba(255,255,255,.035);backdrop-filter:blur(10px);border-color:#ffffff14;box-shadow:none}
.scroll{background:rgba(255,255,255,.025);border-color:#ffffff12}
.cards{display:flex;flex-wrap:wrap;gap:0;margin-bottom:24px}
.cards .card{background:none;backdrop-filter:none;border:0;border-right:1px solid var(--bd);border-radius:0;box-shadow:none;padding:4px 30px 4px 0;margin-right:30px;min-width:150px}
.cards .card:last-child{border-right:0}.cards .card b{font-size:30px;font-weight:700;letter-spacing:-.02em}
.hero{display:grid;grid-template-columns:1.1fr .9fr;min-height:84vh;border-radius:28px;overflow:hidden;border:1px solid #ffffff14;box-shadow:0 30px 80px #000a}
.art{position:relative;overflow:hidden;padding:48px;display:flex;align-items:center;background:linear-gradient(145deg,#2b2f7a,#5b3aa8 55%,#0f766e)}
.orb{position:absolute;border-radius:50%;animation:fl 9s ease-in-out infinite}
.o1{width:280px;height:280px;background:radial-gradient(circle at 30% 30%,#ffffff55,#7c83ff00 70%);top:-70px;right:-50px}
.o2{width:190px;height:190px;background:#34d39955;bottom:40px;left:26px;animation-delay:-3s}
.o3{width:120px;height:120px;background:#fb718566;top:42%;right:18%;animation-delay:-6s}
@keyframes fl{50%{transform:translateY(-24px) scale(1.07)}}
.pitch{position:relative}.pitch .logo{font-size:46px}.pitch h2{font-size:38px;line-height:1.12;margin:12px 0;letter-spacing:-.02em}
.pitch p{color:#e6e8ff;max-width:420px}.ticks span{display:block;margin:7px 0;color:#f1f2ff}
.login{padding:48px;display:flex;flex-direction:column;justify-content:center;gap:10px;background:#0e1120}.login h3{margin:0 0 4px;font-size:22px}
.iagrid{display:grid;grid-template-columns:270px 1fr;gap:16px}
.side{display:flex;flex-direction:column;gap:8px}.lbl{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.05em;margin-top:6px}
.conv{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;color:var(--mu)}
.conv:hover,.conv.on{background:#1d2236;color:var(--tx)}.conv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv i{font-style:normal;opacity:.5}.conv i:hover{opacity:1;color:var(--no)}
@media(max-width:820px){.iagrid,.hero{grid-template-columns:1fr}.art,.login{padding:28px}.pitch h2{font-size:28px}}

:root{--bg:#0a0c1f;--ac:#6d5dfc;--ac2:#c04bff;--ok:#19e3c1;--no:#ff6b6b;--wa:#ffc83d;--card:#12153a;--card2:#171b48;--bd:#2a2f66}
body{background:radial-gradient(900px 520px at 6% -8%,#2a2394 0,transparent 60%),radial-gradient(800px 520px at 100% 0,#7a1fa8 0,transparent 55%),radial-gradient(700px 500px at 50% 112%,#0b6e69 0,transparent 60%),var(--bg)}
button{background:linear-gradient(135deg,#6d5dfc,#c04bff);box-shadow:0 6px 18px #6d5dfc55}
button.sec,button.red{box-shadow:none}button.sec{background:#232a63}
.tabs{background:#0d1030}.tabs button{box-shadow:none}
.art{background:linear-gradient(145deg,#3a2bd6,#a02cd8 52%,#ff6b6b 125%);flex-direction:column;justify-content:center;align-items:flex-start}
.arte{filter:drop-shadow(0 14px 30px #0006);margin-bottom:6px}.coin{animation:fl 6s ease-in-out infinite}
.hand{transform-origin:230px 215px;animation:spin 8s linear infinite}.hand2{animation-duration:96s}@keyframes spin{to{transform:rotate(360deg)}}
.brandlogo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.live{font-size:12px;color:var(--ok);font-weight:600}
.aviso{font-size:13px;border-radius:10px}.aviso.err{color:#ffd9d9;background:#3a1c28;padding:10px 12px;border:1px solid #ff6b6b66}
.aviso.ok{color:#c6fff3;background:#0c3a37;padding:10px 12px;border:1px solid #19e3c166}
.item{padding:11px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
.faixa{border-radius:14px;padding:11px 14px;margin-bottom:14px;font-size:13.5px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.faixa.fech{background:#3a2a05;border:1px solid #ffc83d88;color:#ffe9b0}.faixa.aberto{background:#0c3a37;border:1px solid #19e3c155;color:#c6fff3}
.qrbox{background:#fff;border-radius:16px;padding:14px;width:230px;max-width:100%;margin:6px auto}.qrbox svg{width:100%;height:auto;display:block}
.preco{font-size:34px;font-weight:800;letter-spacing:-.02em}.preco small{font-size:14px;font-weight:500;color:var(--mu)}
.passos{margin:4px 0;padding-left:18px;color:var(--mu)}.passos li{margin:4px 0}
a{color:#b9b3ff}.aceite{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mu)}.aceite input{margin-top:3px}
.legal{max-width:720px;max-height:86vh;overflow:auto}.legal h4{margin:14px 0 4px}.legal p{margin:4px 0;color:#c9cdea}
@media(max-width:640px){.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}.cards .card{border:0;margin:0;padding:0;min-width:0}.cards .card b{font-size:21px}.cards .card.ring{grid-column:1/-1}}
.o2{left:auto;right:26px;bottom:26px}.faixa b,.card .faixa b{font-size:inherit}
</style>

<body>
<div id="app" class="wrap"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const SB_URL='https://jlufubazlnrelrbsvsal.supabase.co';
const SB_KEY='sb_publishable__CjlaAIa2w5F_7HhOhJKkA_HeDFWxNS';
if(typeof supabase==='undefined'){document.getElementById('app').innerHTML='<div class="auth"><h1>Não foi possível carregar</h1><div class="mu">O app precisa de internet para carregar suas bibliotecas. Abra este arquivo no Chrome com internet (não na pré-visualização do Claude).</div></div>';throw new Error('biblioteca supabase ausente')}
const sb=supabase.createClient(SB_URL,SB_KEY);
const MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const S={view:'planilha',lanc:[],sug:[],cats:[],membros:[],anos:[],meses:[]};
const $=s=>document.querySelector(s);
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dataLocalISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'err':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3800)}
async function q(p){const r=await p;if(r.error){toast(r.error.message,1);throw r.error}return r.data}
const canEdit=()=>S.me&&S.me.papel!=='leitor';
const mesAberto=()=>S.mes&&S.mes.status==='aberto';

/* ---------- sessão ---------- */
function mostrarErroInicial(e){
  console.error('Falha ao iniciar o Copiloto Financeiro:',e);
  const app=document.getElementById('app');
  if(!app)return;
  app.innerHTML='<div class="auth"><h1>Não foi possível abrir o aplicativo</h1><p class="mu">Ocorreu uma falha ao carregar sua conta. Seus lançamentos não foram alterados. Confira sua conexão e tente novamente.</p><button id="tentar-novamente">Tentar novamente</button><p class="mu" style="font-size:12px">Se continuar, envie uma captura do Console do navegador para o suporte.</p></div>';
  const btn=document.getElementById('tentar-novamente');
  if(btn)btn.onclick=()=>{app.innerHTML='<div class="auth mu">Carregando…</div>';boot().catch(mostrarErroInicial)};
}
(async()=>{
  try{
    const{data}=await sb.auth.getSession();
    S.user=data.session?.user||null;
    await boot();
    sb.auth.onAuthStateChange((ev,s)=>{
      const u=s?.user||null;
      if((u?.id)!==(S.user?.id)){S.user=u;boot().catch(mostrarErroInicial)}
    });
  }catch(e){mostrarErroInicial(e)}
})();

async function boot(){
  await carregarConfig();
  if(!S.user){renderAuth();checarServidor();return}
  $('#app').innerHTML='<div class="auth mu">Carregando…</div>';
  const rows=await q(sb.from('membros').select('id,papel,nome,familias(id,nome,meta_reducao_cartao,acesso_ate)').eq('usuario_id',S.user.id));
  if(!rows.length)return renderSemFamilia();
  S.me=rows[0];S.fam=rows[0].familias;
  S.admin=!!(await sb.rpc('eh_admin')).data;
  if(!S.admin&&!(S.fam.acesso_ate&&new Date(S.fam.acesso_ate)>new Date()))return renderPaywall();
  ligarTempoReal();
  try{await sb.rpc('gerar_lembretes',{p_familia:S.fam.id});const nr=await sb.from('notificacoes').select('*').eq('lida',false).order('criado_em',{ascending:false}).limit(30);S.notifs=nr.data||[]}catch(e){S.notifs=[]}
  if(S.admin){const rr=await sb.rpc('admin_resumo');S.admPend=rr.data?rr.data.pendentes:0}
  const[c,ct,m,a]=await Promise.all([
    q(sb.from('categorias').select('*').eq('familia_id',S.fam.id).order('nome')),
    q(sb.from('contas_cartoes').select('*').eq('familia_id',S.fam.id)),
    q(sb.from('membros').select('*').eq('familia_id',S.fam.id).order('criado_em')),
    q(sb.from('anos').select('*').eq('familia_id',S.fam.id).order('ano'))]);
  S.cats=c;S.contas=ct;S.membros=m;S.anos=a;
  S.ano=a.find(x=>x.ano===new Date().getFullYear())||a[a.length-1];
  if(!S.ano){$('#app').innerHTML='<div class="auth"><h1>Preparando seu financeiro</h1><p class="mu">Ainda não existe um ano financeiro cadastrado para esta família. Seus dados estão preservados. Entre em contato com o suporte para concluir a configuração.</p></div>';return}
  await loadAno();
}
async function loadAno(mesNum){
  S.meses=await q(sb.from('meses').select('*').eq('ano_id',S.ano.id).order('mes'));
  if(!S.meses.length){$('#app').innerHTML='<div class="auth"><h1>Preparando seu financeiro</h1><p class="mu">Ainda não existem meses cadastrados neste ano. Seus dados estão preservados. Entre em contato com o suporte para concluir a configuração.</p></div>';return}
  const hoje=new Date();
  S.mes=S.meses.find(m=>m.mes===mesNum)||(S.ano.ano===hoje.getFullYear()?S.meses.find(m=>m.mes===hoje.getMonth()+1):null)||S.meses[0];
  await loadMes();
}
async function loadMes(rd=true){
  const[l,s,rs,mc]=await Promise.all([
    q(sb.from('lancamentos').select('*').eq('mes_id',S.mes.id).order('data_vencimento',{nullsFirst:false}).order('criado_em')),
    q(sb.from('sugestoes').select('*').eq('mes_id',S.mes.id).order('criado_em')),
    q(sb.from('v_resumo_anual').select('*').eq('familia_id',S.fam.id).eq('ano',S.ano.ano).order('mes')),
    q(sb.from('v_meta_cartao').select('*').eq('familia_id',S.fam.id).eq('ano',S.ano.ano))]);
  S.lanc=l;S.sug=s;S.resumo=rs;S.meta=mc;if(rd)render();
}

/* ---------- telas de entrada ---------- */
function renderAuth(){
  $('#app').innerHTML=`<div class="hero"><div class="art"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <div class="pitch">${ARTE}<h2>Copiloto Financeiro</h2><p style="font-size:18px;margin:-4px 0 12px"><b>Um aplicativo brasileiro de finanças para famílias.</b></p>
  <p>Lance as contas do mês e o Copiloto soma tudo, mostra para onde o dinheiro vai e aponta onde dá para economizar.</p>
  <div class="ticks"><span>✔ Cálculo automático do mês e do ano</span><span>✔ Importa a sua planilha do Excel</span><span>✔ Checape: aponta onde dá para economizar</span><span>✔ Acesso por ${brl(PIX.valor)} via Pix</span></div></div></div>
  <div class="login"><h3>Bem-vindo</h3><div class="mu" style="margin-bottom:6px">Entre ou crie sua conta para começar.</div>
  <input id="nome" autocomplete="username" placeholder="Seu nome">
  <input id="senha" type="password" autocomplete="current-password" placeholder="Senha (mín. 8 caracteres)">
  <label class="aceite"><input type="checkbox" id="aceite"><span>Li e aceito os <a href="#" data-act="legal" data-t="termos">Termos de Uso</a> e a <a href="#" data-act="legal" data-t="privacidade">Política de Privacidade</a>.</span></label>
  <div id="recuperacao" hidden><div class="mu">Informe o Gmail já associado e verificado na sua conta.</div><input id="email" type="email" autocomplete="email" placeholder="Gmail cadastrado"></div>
  <div id="aviso" class="aviso"></div>
  <button data-act="entrar">Entrar</button><button class="sec" data-act="cadastrar">Criar conta</button><button class="sec" data-act="reset">Esqueci minha senha</button></div></div>`;
}
function renderSemFamilia(){
  $('#app').innerHTML=`<div class="auth"><h1>Sua família</h1><div class="mu">Crie a família para começar ou entre com um código de convite.</div>
  <input id="fnome" placeholder="Nome da família (ex.: Família Silva)"><button data-act="criarfam">Criar família</button>
  <div class="mu" style="margin-top:8px">Ou entre numa família existente:</div><input id="cod" placeholder="Código do convite"><button class="sec" data-act="entrarfam">Entrar com código</button>
  <button class="red" data-act="sair">Sair</button></div>`;
}

/* ---------- app ---------- */
function render(){
  const ed=canEdit()&&mesAberto();
  const TL={planilha:'📋 Planilha',ano:'📊 Visão do ano',checape:'💡 Checape',plan:'🎯 Planejamento',família:'👨‍👩‍👧 Família'};
  if(S.admin)TL.admin='💼 Admin'+(S.admPend?' ('+S.admPend+')':'');
  const tabs=Object.keys(TL).map(t=>`<button class="${S.view===t?'on':''}" data-act="view" data-v="${t}">${TL[t]}</button>`).join('');
  const anos=S.anos.map(a=>`<option value="${a.id}" ${a.id===S.ano.id?'selected':''}>${a.ano}${a.status==='fechado'?' (fechado)':''}</option>`).join('');
  let body='';

/*PARSER*/
const norm=t=>String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const GRUPOS={'cartoes de credito':'cartoes','retirada mensal':'retirada','fixas / financiamentos':'fixas','outras / variaveis':'variaveis'};
function parseSheetRows(name,rows){
  const m=norm(name).match(/^(janeiro|jan|fevereiro|fev|marco|mar|abril|abr|maio|mai|junho|jun|julho|jul|agosto|ago|setembro|set|outubro|out|novembro|nov|dezembro|dez)(?=[\s\d\/_-]|$)\s*[\/_-]?\s*(\d{4})?/);
  if(!m)return null;
  const out={mes:MES3.indexOf(m[1].slice(0,3))+1,ano:m[2]?+m[2]:null,itens:[],receita:0};
  for(const r of rows){
    const a=norm(r[0]);
    if(a.startsWith('receita prevista')){const v=Number(r[2]);if(v>0)out.receita=v;continue}
    const g=GRUPOS[a];if(!g)continue;
    const v=Number(r[2]);if(!(v>0))continue;
    const pm=String(r[3]??'').match(/(\d+)\s*de\s*(\d+)/i);
    out.itens.push({grupo:g,descricao:String(r[1]??'').trim(),valor:v,parcela_atual:pm?+pm[1]:null,parcelas_total:pm?+pm[2]:null,obs:r[4]?String(r[4]):null});
  }
  return out;
}
function parseGeneric(rows){
  const hi=rows.findIndex(r=>r.some(c=>norm(c)==='valor'));if(hi<0)return null;
  const h=rows[hi].map(norm),ix=k=>h.findIndex(x=>x.startsWith(k));
  const iv=ix('valor'),id=Math.max(ix('descri'),ix('item')),it=ix('tipo');
  if(id<0)return null;const itens=[];
  for(const r of rows.slice(hi+1)){
    const raw=r[iv];const v=typeof raw==='number'?raw:Number(String(raw??'').replace(/[R$\s.]/g,'').replace(',','.'));
    if(!(v>0)||!r[id])continue;
    itens.push({grupo:it>=0&&norm(r[it]).startsWith('receita')?'receita':'variaveis',descricao:String(r[id]).trim(),valor:v});
  }
  return{mes:null,ano:null,itens,receita:0};
}

function catPara(grupo,desc){
  const d=norm(desc),AL={netflix:'streaming',spotify:'streaming',prestacao:'aluguel/financiamento'};
  const pool=S.cats.filter(c=>c.grupo===grupo&&c.tipo===(grupo==='receita'?'receita':'despesa'));
  for(const k in AL)if(d.includes(k)){const c=pool.find(c=>norm(c.nome)===AL[k]);if(c)return c.id}
  const hit=pool.filter(c=>norm(c.nome).length>2&&(d.includes(norm(c.nome))||norm(c.nome).includes(d))).sort((a,b)=>b.nome.length-a.nome.length)[0];
  if(hit)return hit.id;
  const def={fixas:'Moradia',cartoes:'Cartão de crédito',retirada:'Retirada mensal',variaveis:'Outros',receita:'Salário'}[grupo];
  return(S.cats.find(c=>c.nome===def&&!c.parent_id)||{}).id||null;
}

async function lerArquivo(file){
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const meses=[];let gen=null;
  for(const n of wb.SheetNames){
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true});
    const p=parseSheetRows(n,rows);
    if(p){if(p.itens.length||p.receita)meses.push(p)}

  }
  if(!meses.length&&gen){gen.mes=S.mes.mes;gen.ano=S.ano.ano;meses.push(gen)}
  if(!meses.length)return toast('Não encontrei lançamentos nessa planilha',1);

}

  const nome=$('#nome').value.trim(),username=nome.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9._-]+/g,'-').replace(/^[._-]+|[._-]+$/g,'').slice(0,24),senha=$('#senha').value;

function ligarTempoReal(){
  if(S.rt)sb.removeChannel(S.rt);

function solicitarAtualizacaoAoVivo(){

  atualizarAoVivo().catch(e=>{console.error('Atualização em tempo real:',e);S.pend=true});
}
async function atualizarAoVivo(){

      if(S.mes)await loadMes(false);

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='A')e.preventDefault();const a=b.dataset.act;
  const LIVRE=['legal','fecharlegal','view','mes','irmes','metodo','fecharmodal','pers','verplano','impno'];
  if(S.busy&&!LIVRE.includes(a))return toast('Aguarde, ainda estou processando…');
  if(!LIVRE.includes(a))S.busy=true;
  try{
  if(a==='entrar'||a==='cadastrar')await autenticar(a);
  else if(a==='sair'){if(S.rt){sb.removeChannel(S.rt);S.rt=null}await sb.auth.signOut();S.user=null;boot()}
  else if(a==='criarfam'){const n=$('#fnome').value.trim();if(!n)return toast('Informe o nome da família',1);await q(sb.rpc('criar_familia',{p_nome:n}));await boot()}
  else if(a==='entrarfam'){await q(sb.rpc('aceitar_convite',{p_codigo:$('#cod').value.trim()}));await boot()}
  else if(a==='view'){S.view=b.dataset.v;if(S.view==='admin')await carregarAdmin();else if(S.view==='plan')await carregarPlan();else render()}
  else if(a==='mes'){S.mes=S.meses.find(m=>m.mes==b.dataset.m);await loadMes()}
  else if(a==='add'){
    const total=Number($('#n_valor').value),desc=$('#n_desc').value.trim(),tipo=$('#n_tipo').value;
    const parcelas=Number($('#n_parcelas')?.value||1);
    if(!desc||desc.length>160||!Number.isFinite(total)||total<=0)return toast('Informe uma descrição de até 160 caracteres e um valor maior que zero.',1);
    if(tipo==='receita'&&parcelas>1)return toast('Parcelamento está disponível somente para despesas.',1);
    if(!Number.isInteger(parcelas)||parcelas<1||parcelas>30)return toast('Escolha de 1 a 30 parcelas.',1);
    const inicio=$('#n_data').value||dataLocalISO();
    const [yy,mm,dd]=inicio.split('-').map(Number);
    if(!yy||!mm||!dd||mm<1||mm>12||dd<1||dd>31)return toast('Data inicial inválida.',1);
    if(parcelas>1){
      await q(sb.rpc('criar_parcelado_v2',{p_familia:S.fam.id,p_data_inicio:inicio,p_descricao:desc,p_valor_total:total,p_total:parcelas,p_categoria:$('#n_cat').value||null,p_membro:$('#n_mem').value||null}));
    }else{
      const mesId=await q(sb.rpc('garantir_mes',{p_fam:S.fam.id,p_ano:yy,p_mes:mm}));
      await q(sb.from('lancamentos').insert({familia_id:S.fam.id,mes_id:mesId,descricao:desc,valor:Math.round(total*100)/100,tipo,
        status:$('#n_status').value,data_pagamento:$('#n_status').value==='pago'?dataLocalISO():null,
        categoria_id:$('#n_cat').value||null,membro_id:$('#n_mem').value||null,data_vencimento:inicio,
        criado_por:S.user.id}));
    }
    S.anos=await q(sb.from('anos').select('*').eq('familia_id',S.fam.id).order('ano'));
    S.ano=S.anos.find(x=>x.ano===yy)||S.ano;
    toast(parcelas>1?`${parcelas} parcelas criadas de forma integrada. Confira a primeira em ${MN[mm-1]} de ${yy}.`:'Lançamento adicionado.');
    await loadAno(mm)}
  else if(a==='del'){
    const lanc=S.lanc.find(x=>x.id===b.dataset.id);
    if(!lanc)return toast('Lançamento não encontrado. Atualize a tela.',1);
    if(lanc.grupo_parcelas){
      const escolha=prompt('Esta despesa faz parte de uma compra parcelada.\n\nDigite 1 para excluir somente esta parcela.\nDigite 2 para excluir todas as parcelas da compra.\nCancelar para não excluir.');
      if(escolha==='1')await q(sb.from('lancamentos').delete().eq('id',lanc.id));
      else if(escolha==='2')await q(sb.from('lancamentos').delete().eq('grupo_parcelas',lanc.grupo_parcelas));
      else return;
    }else{
      if(!confirm('Excluir este lançamento?'))return;
      await q(sb.from('lancamentos').delete().eq('id',lanc.id));
    }
    await loadMes()}
  else if(a==='pagartudo'){const n=await q(sb.rpc('pagar_todas_contas',{p_mes:S.mes.id}));toast(n+' conta(s) marcada(s) como paga(s)');await loadMes()}

  else if(a==='apagarmes'){if(!confirm('Apagar TODOS os lançamentos de '+MN[S.mes.mes-1]+'?'))return;await q(sb.rpc('apagar_mes',{p_mes:S.mes.id}));await loadMes()}
  else if(a==='apagarano'){if(!confirm('Apagar os lançamentos de TODOS os meses de '+S.ano.ano+'? Não dá para desfazer.'))return;
    await q(sb.rpc('apagar_todos_meses',{p_ano:S.ano.id}));toast('Meses apagados');await loadMes()}
  else if(a==='fecharano')await fecharAno();
  else if(a==='anoant')await irAno(-1);
  else if(a==='anoprox')await irAno(1);
  else if(a==='pagarano'){if(!confirm('Marcar como paga TODA despesa dos meses abertos de '+S.ano.ano+'?'))return;const n=await q(sb.rpc('pagar_todo_ano',{p_ano:S.ano.id}));toast(n+' conta(s) marcada(s) como paga(s)');await loadMes()}
  else if(a==='copmes'){const n=await q(sb.rpc('copiar_mes_anterior',{p_mes:S.mes.id,p_cartoes:false}));toast(n?n+' lançamento(s) copiado(s) do mês anterior (cartões não entram)':'Nada novo para copiar: este mês já tem tudo.');await loadMes()}
  else if(a==='checape'){const n=await q(sb.rpc('gerar_checape',{p_mes:S.mes.id}));toast(n+' sugestão(ões) gerada(s)');await loadMes()}
  else if(a==='aceitar'){await q(sb.rpc('aceitar_sugestao',{p_sug:b.dataset.id}));await loadMes()}
  else if(a==='ignorar'){await q(sb.from('sugestoes').update({status:'ignorada'}).eq('id',b.dataset.id));await loadMes()}
  else if(a==='addmem'){const limite=(PLANOS[S.fam.plano||'pro']||PLANOS.pro).limite;if(S.membros.length>=limite)return toast('Limite do plano atingido: '+limite+' pessoas contando o responsável.',1);const n=$('#mnome').value.trim();if(!n)return toast('Informe o nome',1);
    await q(sb.from('membros').insert({familia_id:S.fam.id,nome:n,papel:'editor',renda_mensal:parseFloat($('#mrenda').value)||null}));
    S.membros=await q(sb.from('membros').select('*').eq('familia_id',S.fam.id).order('criado_em'));render()}
  else if(a==='delmem'){await q(sb.from('membros').delete().eq('id',b.dataset.id));S.membros=await q(sb.from('membros').select('*').eq('familia_id',S.fam.id).order('criado_em'));render()}
  else if(a==='metodo'){S.metodo=b.dataset.m;render()}
  else if(a==='addmeta'){const n=$('#m_nome').value.trim(),v=parseFloat($('#m_alvo').value);if(!n||!(v>0))return toast('Informe nome e valor da meta',1);
    await q(sb.from('metas').insert({familia_id:S.fam.id,nome:n,valor_alvo:v,prazo:$('#m_prazo').value||null,tipo:$('#m_tipo').value}));await carregarPlan()}
  else if(a==='aporte'){const i=document.querySelector('[data-ap="'+b.dataset.id+'"]'),v=parseFloat(i.value);if(!(v>0))return toast('Digite o valor do aporte',1);
    await q(sb.from('aportes_meta').insert({familia_id:S.fam.id,meta_id:b.dataset.id,valor:v}));toast('Aporte registrado');await carregarPlan()}
  else if(a==='delmeta'){if(!confirm('Excluir esta meta?'))return;await q(sb.from('metas').delete().eq('id',b.dataset.id));await carregarPlan()}
  else if(a==='adddiv'){const n=$('#d_nome').value.trim(),v=parseFloat($('#d_saldo').value);if(!n||!(v>0))return toast('Informe nome e saldo da dívida',1);
    await q(sb.from('dividas').insert({familia_id:S.fam.id,nome:n,credor:$('#d_credor').value.trim()||null,saldo_devedor:v,taxa_juros_mensal:parseFloat($('#d_juros').value)||0,pagamento_minimo:parseFloat($('#d_min').value)||0}));await carregarPlan()}
  else if(a==='deldiv'){if(!confirm('Marcar esta dívida como quitada?'))return;await q(sb.from('dividas').update({ativa:false}).eq('id',b.dataset.id));await carregarPlan()}
  else if(a==='additem'){const n=$('#p_nome').value.trim(),v=parseFloat($('#p_valor').value);if(!n||!(v>0))return toast('Informe nome e valor',1);
    await q(sb.from('patrimonio_itens').insert({familia_id:S.fam.id,tipo:$('#p_tipo').value,nome:n,valor:v}));await carregarPlan()}
  else if(a==='delitem'){await q(sb.from('patrimonio_itens').delete().eq('id',b.dataset.id));await carregarPlan()}
  else if(a==='copiar'){await navigator.clipboard.writeText(S.pv.conteudo);toast('Copiado')}
  else if(a==='fecharmodal'){S.pv=null;S.sino=false;S.hist=null;render()}
  else if(a==='plano'){const p=b.dataset.plano;if(!PLANOS[p])return;S.planoEscolhido=p;PIX.valor=PLANOS[p].valor;await q(sb.from('familias').update({plano:p}).eq('id',S.fam.id));S.fam.plano=p;renderPaywall();return}
  else if(a==='paguei'){const n=$('#pg_nome').value.trim();if(n.length<2)return toast('Informe o seu nome como aparece no Pix',1);
    const plano=planoAtual();const{error}=await sb.from('pagamentos').insert({familia_id:S.fam.id,usuario_id:S.user.id,valor:plano.valor,plano:S.planoEscolhido,pagador_nome:n,horario_informado:$('#pg_hora').value.trim()||null});
    if(error)return toast(/uq_pagamento|duplicate/.test(error.message)?'Você já tem um aviso de pagamento em análise.':error.message,1);
    toast('Aviso enviado! Assim que o Pix for conferido, o acesso é liberado.');await boot()}
  else if(a==='copiarpix'){try{await navigator.clipboard.writeText(S.pixcode);toast('Código Pix copiado')}catch(e){toast('Não consegui copiar: selecione o código acima e copie.',1)}}
  else if(a==='verstatus')await boot();
  else if(a==='aprovar'){const dias=parseInt(document.getElementById('dias_'+b.dataset.id).value)||PIX.dias;await q(sb.rpc('aprovar_pagamento',{p_id:b.dataset.id,p_dias:dias}));toast('✔ Acesso liberado por '+dias+' dias');await carregarAdmin()}
  else if(a==='recusar'){const nota=prompt('Motivo (o cliente vai ver):','Não encontramos o Pix com esse valor/nome.');if(nota===null)return;await q(sb.rpc('recusar_pagamento',{p_id:b.dataset.id,p_nota:nota}));toast('Pedido recusado');await carregarAdmin()}
  else if(a==='addcat'){const n=$('#c_nome').value.trim();if(!n)return toast('Informe o nome da categoria',1);
    const pai=S.cats.find(c=>c.id===$('#c_pai').value),g=pai?pai.grupo:$('#c_grupo').value;
    await q(sb.from('categorias').insert({familia_id:S.fam.id,nome:n,tipo:pai?pai.tipo:(g==='receita'?'receita':'despesa'),grupo:g,parent_id:pai?pai.id:null,essencial:pai?pai.essencial:false}));
    S.cats=await q(sb.from('categorias').select('*').eq('familia_id',S.fam.id).order('nome'));toast('Categoria criada');render()}
  else if(a==='delcat'){if(!confirm('Excluir esta categoria? Os lançamentos que usam ela ficam sem categoria.'))return;await q(sb.from('categorias').delete().eq('id',b.dataset.id));
    S.cats=await q(sb.from('categorias').select('*').eq('familia_id',S.fam.id).order('nome'));await loadMes()}
  else if(a==='legal')showLegal(b.dataset.t);
  else if(a==='fecharlegal'){const d=document.getElementById('legalov');if(d)d.remove()}
  else if(a==='expjson'){const d=await q(sb.rpc('exportar_tudo',{p_familia:S.fam.id}));const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));l.download='meus-dados-'+S.fam.nome.replace(/\s+/g,'-')+'.json';l.click();toast('Arquivo com todos os seus dados baixado')}
  else if(a==='delconta'){const t=prompt('Isto apaga a sua conta e os dados da sua família, para sempre. Para confirmar, digite EXCLUIR:');if(t!=='EXCLUIR')return;await q(sb.rpc('excluir_minha_conta'));try{await sb.auth.signOut()}catch(e){}S.user=null;toast('Conta excluída.');boot()}
  else if(a==='salvarcfg'){const k=['pix_chave','pix_valor','pix_dias','pix_nome','pix_cidade','operador_nome','operador_cnpj','contato_email'],o={};k.forEach(x=>{const v=$('#cfg_'+x).value.trim();if(v!==''||x.startsWith('operador')||x==='contato_email')o[x]=v});
    await q(sb.rpc('admin_salvar_config',{p_itens:o}));await carregarConfig();toast('Configurações salvas');render()}
  else if(a==='sino'){S.sino=true;render()}
  else if(a==='lerTodos'){await q(sb.from('notificacoes').update({lida:true}).eq('lida',false));S.notifs=[];S.sino=false;render()}
  else if(a==='hist'){S.hist=await q(sb.from('historico').select('*').eq('familia_id',S.fam.id).eq('tabela','lancamentos').order('criado_em',{ascending:false}).limit(40));render()}
  else if(a==='desfazer'){await q(sb.rpc('desfazer',{p_hist:Number(b.dataset.id)}));toast('Alteração desfeita');S.hist=null;await loadMes()}
  else if(a==='imp')$('#arq').click();
  else if(a==='impok')await importar();
  else if(a==='impno'){S.imp=null;render()}
  else if(a==='xlsx')await exportXlsx();
  else if(a==='irmes'){S.view='planilha';S.mes=S.meses.find(m=>m.mes==b.dataset.m);await loadMes()}
  else if(a==='csv')csv();
  else if(a==='reset'){const area=$('#recuperacao');if(area.hidden){area.hidden=false;$('#email').focus();aviso('Informe o Gmail já associado e verificado na sua conta.');return}const em=$('#email').value.trim();if(!em)return aviso('Informe o Gmail cadastrado.');const{error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.href.split('#')[0]});aviso(error?'Não consegui enviar: '+error.message:'Se esse e-mail estiver associado a uma conta, enviaremos um link de redefinição.',!error)}
  else if(a==='convite'){const limite=(PLANOS[S.fam.plano||'pro']||PLANOS.pro).limite;if(S.membros.length>=limite)return toast('Limite do plano atingido: '+limite+' pessoas no total.',1);const c=await q(sb.rpc('criar_convite',{p_familia:S.fam.id,p_papel:$('#cpapel').value}));$('#cres').textContent=c}
  }catch(err){}finally{S.busy=false}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  try{
  if(t.id==='anosel'){S.ano=S.anos.find(a=>a.id===t.value);await loadAno();return}
  if(t.dataset.cf){const id=t.closest('tr').dataset.cid,f=t.dataset.cf,c=S.cats.find(x=>x.id===id),p={};
    if(f==='nome'){const v=t.value.trim();if(!v)return;p.nome=v}else if(f==='grupo'){p.grupo=t.value;p.tipo=t.value==='receita'?'receita':'despesa'}else p.essencial=t.value==='true';
    await q(sb.from('categorias').update(p).eq('id',id));
    if(p.grupo&&!c.parent_id)await q(sb.from('categorias').update({grupo:p.grupo,tipo:p.tipo}).eq('parent_id',id));
    S.cats=await q(sb.from('categorias').select('*').eq('familia_id',S.fam.id).order('nome'));await loadMes();toast('Categoria atualizada');return}
  if(t.id==='arq'){const f=t.files[0];t.value='';if(f)await lerArquivo(f);return}
  if(t.dataset.af){const v=parseFloat(t.value)||0;await q(sb.from('anos').update({poupanca_inicial:v}).eq('id',S.ano.id));S.ano.poupanca_inicial=v;await loadMes();toast('Poupança inicial atualizada');return}
  if(t.dataset.ff){const v=parseFloat(t.value)||0;await q(sb.from('familias').update({meta_reducao_cartao:v}).eq('id',S.fam.id));S.fam.meta_reducao_cartao=v;await loadMes();toast('Meta atualizada');return}
  if(t.dataset.rf){const id=t.closest('tr').dataset.mid;await q(sb.from('membros').update({renda_mensal:parseFloat(t.value)||null}).eq('id',id));
    S.membros=await q(sb.from('membros').select('*').eq('familia_id',S.fam.id).order('criado_em'));toast('Renda atualizada');return}
  if(t.dataset.f){
    const id=t.closest('tr').dataset.id,f=t.dataset.f;let v=t.value;const p={};
    if(f==='valor'){v=parseFloat(v);if(isNaN(v))return}
    if(['categoria_id','membro_id','data_vencimento'].includes(f))v=v||null;
    p[f]=v;
    if(f==='status')p.data_pagamento=v==='pago'?new Date().toISOString().slice(0,10):null;
    if(f==='tipo')p.categoria_id=null;
    await q(sb.from('lancamentos').update(p).eq('id',id));await loadMes()}
  }catch(err){}
});
document.addEventListener('focusout',()=>{if(S.pend)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))atualizarAoVivo()},250)});
document.addEventListener('wheel',()=>{const a=document.activeElement;if(a&&a.type==='number')a.blur()},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.type==='number'&&(e.key==='ArrowUp'||e.key==='ArrowDown'))e.preventDefault();if(e.target.id==='senha'&&e.key==='Enter')document.querySelector('[data-act=entrar]').click();});
</script>
