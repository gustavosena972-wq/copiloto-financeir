.pix-card:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#8b7bff,#d8c5ff,#8b7bff);background-size:200% 100%;animation:pixShimmer 4s linear infinite}
.pix-card:after{content:"";position:absolute;width:230px;height:230px;right:-130px;top:80px;border-radius:50%;border:1px solid #a99aff22;box-shadow:0 0 0 22px #a99aff09,0 0 0 46px #a99aff06;pointer-events:none}

.pix-step b{color:#f2efff}.pix-step small{color:#c0c1df}
.pix-payment .qrbox{width:min(238px,100%);padding:17px;border-radius:19px;box-shadow:0 12px 35px #0005;animation:pixQrIn .85s .58s both}
.pix-copy{border:1px solid #6659a8!important;background:#26224e!important;color:#e4deff!important;border-radius:13px!important;font-weight:750}
.pix-copy:hover{background:#39316c!important}
.pix-label{color:#d0cbea}

.pix-pending{background:linear-gradient(120deg,#123c36,#15332f);border:1px solid #328675;color:#d0fff1;animation:pixRise .6s both}

@keyframes pixRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes pixCardIn{from{opacity:0;transform:translateY(28px) scale(.985);filter:blur(5px)}to{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
@keyframes pixQrIn{from{opacity:0;transform:scale(.88) rotate(-2deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@keyframes pixShimmer{to{background-position:200% 0}}

/* ---------- Identidade visual Copiloto: ChatGPT x Claude, acabamento financeiro ---------- */
:root{
  --cf-paper:#f7f7f3;
  --cf-white:#fff;
  --cf-sidebar:#efeee8;
  --cf-ink:#252d29;
  --cf-muted:#78817a;
  --cf-line:#e4e5dd;
  --cf-green:#28634f;
  --cf-green-dark:#214f40;
  --cf-green-soft:#e7f0e9;
  --cf-sand:#f2eee5;
  --cf-amber:#a97938;
  --cf-red:#b95752;
}
html{background:var(--cf-paper)}
body{
  color:var(--cf-ink);
  background:
    radial-gradient(ellipse at 12% 0%,rgba(225,234,224,.55),transparent 34%),
    var(--cf-paper);
  font-family:Inter,"Aptos",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
button{border-radius:10px;background:var(--cf-green);color:#fff;box-shadow:none;font-weight:650}
button:hover{background:var(--cf-green-dark);filter:none;transform:translateY(-1px)}
button.sec{background:#f0f1ec;border:1px solid #dfe2d9;color:#46524a;box-shadow:none}
button.sec:hover{background:#e8ebe4}
button.red{background:#fff2f0;border:1px solid #f0d7d2;color:var(--cf-red)}
input,select,textarea{border:1px solid #dce0d8;border-radius:9px;background:#fff;color:var(--cf-ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:#78a48c;box-shadow:0 0 0 3px rgba(65,128,94,.12)}
#toast{background:#263b31;border:1px solid #41604f;color:#f5faf5;box-shadow:0 12px 32px rgba(22,35,27,.18)}
#toast.err{background:#5a302d;border-color:#a85a52}
#app:has(.app-shell){width:100%;max-width:1600px;padding:22px}
.app-shell{
  --ui-text:var(--cf-ink);
  --ui-muted:var(--cf-muted);
  --ui-line:var(--cf-line);
  --ui-panel:#fff;
  grid-template-columns:252px minmax(0,1fr);
  min-height:calc(100dvh - 44px);
  background:#fbfbf8;
  color:var(--cf-ink);
  border:1px solid #e6e6df;
  border-radius:20px;
  box-shadow:0 18px 55px rgba(45,51,43,.07);
  overflow:hidden;
}
.app-sidebar{
  gap:27px;
  padding:24px 17px 18px;
  background:var(--cf-sidebar);
  color:#36413a;
  border-right:1px solid #e3e3db;
  border-radius:0;
}
.sidebar-head{gap:22px}
.sidebar-brand{gap:11px}
.sidebar-brand svg{width:37px;height:37px}
.sidebar-brand strong{color:#26352d;font-size:17px;font-weight:760;letter-spacing:-.035em}
.sidebar-brand small{color:#879087;font-size:8px;letter-spacing:.19em}
.sidebar-family{
  padding:13px 12px;
  border:1px solid #e0e2d9;
  border-radius:12px;
  background:rgba(255,255,255,.72);
}
.sidebar-family small{color:#849087;font-size:8px;letter-spacing:.14em}
.sidebar-family strong{color:#34433a;font-size:12px}
.sidebar-family span{color:#738178;font-size:9px}

/* ---------- refinamento de hierarquia, densidade e microinterações ---------- */
:root{
 --cf-ink:#26332c;
 --cf-muted:#707d73;
 --cf-line:#e0e5dc;
 --cf-green:#28634f;
 --cf-green-dark:#204f3f;
 --cf-green-pale:#e8f1e9;
 --cf-card:#fff;
}
button,a,.nav-item,.meses button,.landing-plan-card,.pix-plan,.app-main .card,.app-main .sug{
  -webkit-tap-highlight-color:transparent;
}
button{
  border-radius:11px;
  transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease,color .18s ease;
}
button:hover{transform:translateY(-1px)}
button:active{transform:translateY(0) scale(.985);box-shadow:inset 0 1px 3px rgba(20,40,28,.12)}
button:focus-visible,a:focus-visible,.nav-item:focus-visible{
  outline:3px solid rgba(66,132,91,.27);
  outline-offset:2px;
}
.app-shell{
  grid-template-columns:246px minmax(0,1fr);
  border-radius:22px;
  box-shadow:0 20px 56px rgba(42,52,43,.075);
}
.app-sidebar{padding:22px 15px 16px;gap:23px}
.sidebar-head{gap:19px}
.sidebar-brand svg,.landing-brand svg,.pix-brand svg{
  flex:none;
  filter:drop-shadow(0 3px 5px rgba(31,77,53,.12));
  transition:transform .22s ease,filter .22s ease;
}
.sidebar-brand:hover svg,.landing-brand:hover svg,.pix-brand:hover svg{
  transform:translateY(-2px) rotate(-3deg);
  filter:drop-shadow(0 5px 8px rgba(31,77,53,.18));
}
.sidebar-family{padding:12px 12px;border-radius:14px}
.sidebar-family strong{font-size:13px}
.nav-section-title{font-size:9px;letter-spacing:.13em}
.nav-item{min-height:42px;padding:9px 11px;border-radius:11px;font-size:12.5px}
.nav-item.on{box-shadow:inset 3px 0 #4a8a65,0 2px 5px rgba(45,93,62,.06)}
.nav-item:hover{transform:translateX(2px)}
.nav-icon{width:23px;height:23px;border-radius:8px;transition:background .18s ease,transform .18s ease}
.nav-item:hover .nav-icon{transform:scale(1.07)}
.app-main{padding:27px 30px 34px}
.app-topbar{gap:18px;margin-bottom:17px;padding-bottom:17px}
.page-eyebrow{font-size:9px;letter-spacing:.13em}
.page-heading h1{font-size:25px;line-height:1.2}
.page-heading p{margin-top:6px;font-size:13px;line-height:1.55}
.date-line{font-size:11px}
.top-actions{gap:7px}
.utility-button,.session-button{min-height:37px;border-radius:10px;font-size:11.5px}
.year-control{border-radius:11px}
.app-main .meses{gap:7px;margin-bottom:16px}
.app-main .meses button{min-height:36px;padding:7px 13px;border-radius:10px;font-size:11.5px}
.app-main .meses button.on{box-shadow:0 3px 9px rgba(40,99,79,.13)}
.app-main .cards{gap:11px;margin-bottom:15px}
.app-main .cards .card{padding:15px 16px;border-radius:15px;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}

function renderTamanduaIntro(step=0){
  S.tamanduaIntroStep=step;

function renderWorkspaceOrKeepTamandua(){
  if(S.user&&S.fam&&!tamanduaIntroCompleted()){
    if(!document.querySelector('.cf-tamandua-intro')){
      renderTamanduaIntro(S.tamanduaIntroStep||0);
    }
    return;
  }
  render();
}
function finishTamanduaIntro(){
  const groups=['melhorar','necessidade','organizacao','economia'];
  const unanswered=groups.filter(name=>!document.querySelector('input[name="'+name+'"]:checked'));
  if(unanswered.length){
    toast('Marque ao menos uma opção em cada pergunta para continuar.',1);
    return;
  }
  const profile={};
  groups.forEach(name=>profile[name]=[...document.querySelectorAll('input[name="'+name+'"]:checked')].map(x=>x.value));
  profile.version=1;
  profile.savedAt=new Date().toISOString();
  const introKey=tamanduaStorageKey('intro');
  if(!introKey||!S.user?.id||!S.fam?.id){
    toast('Entre novamente na sua conta para salvar suas preferências.',1);
    return;
  }
  try{
    await mobileLearnFromInteraction(profile);
    localStorage.setItem(introKey,'1');
  }catch(e){
    console.error('Falha ao persistir o perfil adaptativo:',e);
    toast('Não foi possível salvar suas preferências agora. Tente novamente.',1);
    return;
  }
  S.tamanduaProfile=profile;
  S.tamanduaIntroStep=0;
  render();
}

function mostrarErroInicial(e){
  console.error('Falha ao iniciar o Copiloto Financeiro:',e);
  const app=document.getElementById('app');
  if(!app)return;
  app.innerHTML='<div class="auth"><h1>Não foi possível abrir o aplicativo</h1><p class="mu">Ocorreu uma falha ao carregar sua conta. Seus lançamentos não foram alterados. Confira sua conexão e tente novamente.</p><button id="tentar-novamente">Tentar novamente</button><p class="mu" style="font-size:12px">Se continuar, envie uma captura do Console do navegador para o suporte.</p></div>';
  const btn=document.getElementById('tentar-novamente');

}
(async()=>{
  try{
    const{data}=await sb.auth.getSession();
    S.user=data.session?.user||null;
    await boot();
    sb.auth.onAuthStateChange((ev,s)=>{

let authBootTimer=null;
function scheduleBoot(){
  if(authBootTimer!==null)return;
  authBootTimer=setTimeout(()=>{
    authBootTimer=null;
    boot().catch(mostrarErroInicial);
  },0);
}

async function boot(){
  // Isola permissões e dados entre sessões diferentes.
  S.admin=false;S.adm=null;S.admPend=0;S.me=null;S.fam=null;
  if(S.rt){try{sb.removeChannel(S.rt)}catch(e){}S.rt=null}
  await carregarConfig();
  if(!S.user){S.tamanduaProfile=null;renderAuth();checarServidor();return}
  $('#app').innerHTML='<div class="auth mu">Carregando…</div>';
  const adminCheck=await sb.rpc('eh_admin');
  if(adminCheck.error)throw adminCheck.error;
  S.admin=adminCheck.data===true;
  const testerCheck=await sb.rpc('is_internal_tester');
  if(testerCheck.error)throw testerCheck.error;
  S.internalTester=testerCheck.data===true;
  const rows=await q(sb.from('membros').select('id,papel,nome,familias(id,nome,meta_reducao_cartao,acesso_ate,plano)').eq('usuario_id',S.user.id).order('criado_em',{ascending:false}));
  if(!rows.length){
    S.adm=null;
    if(S.admin){S.me=null;S.fam=null;S.view='admin';await carregarAdmin();return;}
    return renderSemFamilia();
  }
  // Cada conta possui uma única família. A associação vem do banco; não há seletor local de família.
  S.me=rows[0];S.fam=S.me.familias;
  await loadTamanduaProfile();
  if(!S.admin&&!S.internalTester&&!(S.fam.acesso_ate&&new Date(S.fam.acesso_ate)>new Date()))return renderPaywall();
  ligarTempoReal();
  try{await sb.rpc('gerar_lembretes',{p_familia:S.fam.id});const nr=await sb.from('notificacoes').select('*').eq('lida',false).order('criado_em',{ascending:false}).limit(30);S.notifs=nr.data||[]}catch(e){S.notifs=[]}
  if(S.admin){const rr=await sb.rpc('admin_resumo');S.admPend=rr.data?rr.data.pendentes:0}
  const[c,ct,m,a]=await Promise.all([
    q(sb.from('categorias').select('*').eq('familia_id',S.fam.id).order('nome')),
    q(sb.from('contas_cartoes').select('*').eq('familia_id',S.fam.id)),
    q(sb.from('membros').select('*').eq('familia_id',S.fam.id).order('criado_em')),
    q(sb.from('anos').select('*').eq('familia_id',S.fam.id).order('ano'))]);
  S.cats=c;S.contas=ct;S.membros=m;S.anos=a;
  S.ano=a.find(x=>x.ano===new Date().getFullYear())||a[a.length-1];
  if(!S.ano){$('#app').innerHTML='<div class="auth"><h1>Preparando seu financeiro</h1><p class="mu">Ainda não existe um ano financeiro cadastrado para esta família. Seus dados estão preservados. Entre em contato com o suporte para concluir a configuração.</p></div>';return}
  await loadAno();
}
async function loadAno(mesNum){
  S.meses=await q(sb.from('meses').select('*').eq('ano_id',S.ano.id).order('mes'));
  if(!S.meses.length){$('#app').innerHTML='<div class="auth"><h1>Preparando seu financeiro</h1><p class="mu">Ainda não existem meses cadastrados neste ano. Seus dados estão preservados. Entre em contato com o suporte para concluir a configuração.</p></div>';return}
  const hoje=new Date();
  S.mes=S.meses.find(m=>m.mes===mesNum)||(S.ano.ano===hoje.getFullYear()?S.meses.find(m=>m.mes===hoje.getMonth()+1):null)||S.meses[0];
  const refreshAggregates=!S._aggregateYearId||S._aggregateYearId!==S.ano.id;
  await loadMes(true,refreshAggregates);
}
async function loadMes(rd=true,refreshAggregates=true){
  const[l,s]=await Promise.all([
    q(sb.from('lancamentos').select('*').eq('mes_id',S.mes.id).order('data_vencimento',{nullsFirst:false}).order('criado_em')),
    q(sb.from('sugestoes').select('*').eq('mes_id',S.mes.id).order('criado_em'))]);
  S.lanc=l;S.sug=s;
  if(rd)renderWorkspaceOrKeepTamandua();
  if(refreshAggregates){
    const[rs,mc]=await Promise.all([
      q(sb.from('v_resumo_anual').select('*').eq('familia_id',S.fam.id).eq('ano',S.ano.ano).order('mes')),
      q(sb.from('v_meta_cartao').select('*').eq('familia_id',S.fam.id).eq('ano',S.ano.ano))]);
    S.resumo=rs;S.meta=mc;S._aggregateYearId=S.ano.id;
    if(rd)renderWorkspaceOrKeepTamandua();
  }
}

function scrollLandingRoute(route){
  const page=document.querySelector('.landing-page');
  if(page&&!S.user&&['inicio','recursos','planos'].includes(route))page.dataset.screen=route;
  requestAnimationFrame(()=>{
    if(route==='inicio'){
      window.scrollTo({top:0,behavior:'smooth'});
      return;
    }
    const target=route==='recursos'
      ?document.querySelector('.landing-page .landing-benefits')
      :route==='planos'
        ?document.querySelector('.landing-page .landing-plans-section')
        :['login','cadastro'].includes(route)
          ?document.querySelector('.landing-page .landing-login-section')
          :null;
    if(target)target.scrollIntoView({behavior:'smooth',block:'start'});
    else window.scrollTo({top:0,behavior:'smooth'});
  });
}
if(!window.__cfLandingHashBound){window.__cfLandingHashBound=true;window.addEventListener('hashchange',()=>{const route=(location.hash||'#inicio').slice(1);const page=document.querySelector('.landing-page');const wantsAccess=['login','cadastro'].includes(route);const isAccess=page?.dataset.screen==='acesso';if(!S.user&&(!page||wantsAccess!==isAccess||(wantsAccess&&route==='cadastro'&&document.getElementById('landing-terms')?.style.display!=='flex')||(wantsAccess&&route==='login'&&document.getElementById('landing-terms')?.style.display==='flex')))renderAuth();else if(!S.user&&page&&!wantsAccess&&['inicio','recursos','planos'].includes(route))page.dataset.screen=route;scrollLandingRoute(route);});}
if(!window.__cfLandingRouteBound){window.__cfLandingRouteBound=true;document.addEventListener('click',e=>{const link=e.target.closest('[data-public-route]');if(!link)return;e.preventDefault();const route=link.dataset.publicRoute;if(!['inicio','recursos','planos','login','cadastro'].includes(route))return;const hash='#'+route;if(location.hash===hash){if(!S.user){const page=document.querySelector('.landing-page');if(!page||(['login','cadastro'].includes(route)!==(page.dataset.screen==='acesso')))renderAuth();}scrollLandingRoute(route);}else{if(!S.user&&['inicio','recursos','planos'].includes(route)){const page=document.querySelector('.landing-page');if(page)page.dataset.screen=route;}location.hash=hash;scrollLandingRoute(route);}});}

function viewRelatorios(){
  const R=S.resumo||[];

  const receita=soma('receita'),despesas=soma('total_despesas'),saldo=soma('saldo');
  const ativos=R.filter(r=>Number(r.receita)||Number(r.total_despesas)).length;
  const media=ativos?despesas/ativos:0;
  const maior=R.reduce((a,r)=>Number(r.total_despesas||0)>Number(a.total_despesas||0)?r:a,{});
  const max=Math.max(1,...R.map(r=>Math.max(Number(r.receita||0),Number(r.total_despesas||0))));
  const barras=R.map(r=>'<div class="cf-chart-month"><div class="cf-chart-pair"><i class="income" style="height:'+Math.max(2,Number(r.receita||0)/max*100)+'%" title="Receitas '+brl(r.receita)+'"></i><i class="expense" style="height:'+Math.max(2,Number(r.total_despesas||0)/max*100)+'%" title="Despesas '+brl(r.total_despesas)+'"></i></div><small>'+MN[r.mes-1].slice(0,3)+'</small></div>').join('');
  const grupos={};
  S.lanc.filter(l=>l.tipo==='despesa').forEach(l=>{
    const c=S.cats.find(x=>x.id===l.categoria_id);
    const p=c&&c.parent_id?S.cats.find(x=>x.id===c.parent_id):c;
    const n=p?p.nome:'Sem categoria';
    grupos[n]=(grupos[n]||0)+Number(l.valor||0);
  });
  const categorias=Object.entries(grupos).sort((a,b)=>b[1]-a[1]);
  const totalCategorias=categorias.reduce((a,x)=>a+x[1],0);
  const linhasCategoria=categorias.slice(0,8).map(([n,v])=>'<div class="cf-report-line"><span>'+esc(n)+'</span><div class="cf-report-track"><i style="width:'+Math.min(100,v/(totalCategorias||1)*100)+'%"></i></div><b>'+brl(v)+'</b></div>').join('')||'<p class="mu">Sem despesas categorizadas neste mês.</p>';
  const linhas=R.map(r=>'<tr data-act="irmes" data-m="'+r.mes+'" style="cursor:pointer"><td>'+MN[r.mes-1]+'</td><td class="pos">'+brl(r.receita)+'</td><td class="neg">'+brl(r.total_despesas)+'</td><td class="'+(Number(r.saldo)>=0?'pos':'neg')+'">'+brl(r.saldo)+'</td><td>'+brl(r.poupanca_acumulada)+'</td></tr>').join('');
  return '<div class="cards"><div class="card"><small>Receitas do ano</small><b class="pos">'+brl(receita)+'</b></div><div class="card"><small>Despesas do ano</small><b class="neg">'+brl(despesas)+'</b></div><div class="card"><small>Saldo acumulado</small><b class="'+(saldo>=0?'pos':'neg')+'">'+brl(saldo)+'</b></div><div class="card"><small>Média mensal de despesas</small><b>'+brl(media)+'</b></div></div><section class="cf-section"><div class="cf-section-head"><div><span>DESEMPENHO ANUAL</span><h2>Receitas e despesas</h2><p>Comparativo mensal dos valores registrados.</p></div><div class="cf-legend"><span><i class="income"></i> Receitas</span><span><i class="expense"></i> Despesas</span></div></div><div class="cf-chart">'+(barras||'<p class="mu">Ainda não há movimentações neste ano.</p>')+'</div></section><section class="cf-section"><div class="cf-section-head"><div><span>COMPOSIÇÃO DO MÊS</span><h2>Onde estão as despesas</h2><p>Distribuição das despesas do mês selecionado.</p></div><b>'+brl(totalCategorias)+'</b></div>'+linhasCategoria+'</section><section class="cf-section"><div class="cf-section-head"><div><span>HISTÓRICO</span><h2>Resumo mês a mês</h2><p>Clique em um mês para abrir a planilha correspondente.</p></div><button class="sec" data-act="xlsx">Exportar ano (Excel)</button></div><div class="scroll"><table style="min-width:620px"><thead><tr><th>Mês</th><th>Receitas</th><th>Despesas</th><th>Saldo</th><th>Poupança</th></tr></thead><tbody>'+linhas+'</tbody></table></div><p class="cf-note-text">Maior despesa mensal: '+(maior.mes?MN[maior.mes-1]+' · '+brl(maior.total_despesas):'sem dados suficientes')+'. Valores baseados nos lançamentos do aplicativo.</p></section>';
}

function atualizarParcelamento(){
  const s=$('#n_parcelas'),tipo=$('#n_tipo')?.value,natureza=$('#n_natureza')?.value||'compra';
  if(!s)return;
  const limite=natureza==='financiamento'?600:30,atual=Number(s.value||1);
  s.innerHTML=Array.from({length:limite},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'x</option>').join('');
  s.value=String(Math.min(atual,limite));
  if(tipo==='receita')s.value='1';
  s.disabled=tipo==='receita';
  const n=$('#n_natureza');if(n)n.disabled=tipo==='receita';
  const v=$('#n_valor'),h=$('#n_valor_help');
  if(v)v.placeholder=natureza==='financiamento'?'Valor mensal (R$)':'Valor total (R$)';
  if(h)h.textContent=(natureza==='financiamento'?'Informe o valor de uma prestação. O sistema projeta esse valor pelos meses escolhidos.':'Informe o valor total da compra. O sistema divide pelas parcelas e ajusta os centavos na última.')+' O status selecionado será aplicado à primeira parcela; as demais começam pendentes.';
  s.title=natureza==='financiamento'?'Prestação/financiamento de 2 a 600 meses':'Compra parcelada de 1 a 30 vezes';
}
async function mostrarCompromissos(){
  const dados=[];
  for(let inicio=0;;inicio+=1000){
    const lote=await q(sb.from('lancamentos')
      .select('id,grupo_parcelas,descricao,valor,status,data_vencimento,parcela_atual,parcelas_total,natureza_compromisso,categoria_id')
      .eq('familia_id',S.fam.id).not('parcelas_total','is',null)
      .order('data_vencimento').order('id').range(inicio,inicio+999));
    if(!lote?.length)break;
    dados.push(...lote);
    if(lote.length<1000)break;
  }
  const grupos=new Map();
  for(const l of dados||[]){
    if(!l.parcelas_total||!l.parcela_atual)continue;
    let chave=l.grupo_parcelas;
    if(!chave&&l.data_vencimento){
      const [ano,mes]=l.data_vencimento.split('-').map(Number);
      const indice=ano*12+(mes-1)-(Number(l.parcela_atual)-1);
      const inicio=Math.floor(indice/12)+'-'+String(indice%12+1).padStart(2,'0');
      chave='importada:'+norm(l.descricao)+':'+l.parcelas_total+':'+(l.categoria_id||'')+':'+(l.natureza_compromisso||'compra')+':'+inicio;
    }
    if(!chave)continue;
    if(!grupos.has(chave))grupos.set(chave,[]);
    grupos.get(chave).push(l);
  }
  const cards=[...grupos.values()].map(lista=>{
    lista.sort((a,b)=>(a.parcela_atual||0)-(b.parcela_atual||0));
    const base=lista[0],totalParcelas=Math.max(...lista.map(x=>Number(x.parcelas_total)||0));
    const pagas=lista.filter(x=>x.status==='pago'),abertas=lista.filter(x=>x.status!=='pago');
    const totalRegistrado=lista.reduce((a,x)=>a+Number(x.valor||0),0);
    const saldo=abertas.reduce((a,x)=>a+Number(x.valor||0),0);
    const proxima=abertas.slice().sort((a,b)=>String(a.data_vencimento||'').localeCompare(String(b.data_vencimento||'')))[0];
    const natureza=base.natureza_compromisso==='financiamento'?'Prestação / financiamento':'Compra parcelada';
    const pct=totalParcelas?Math.min(100,Math.round(pagas.length/totalParcelas*100)):0;
    const linhas=lista.map(x=>'<tr><td>'+(''+(x.parcela_atual||'—'))+'/'+totalParcelas+'</td><td>'+(x.data_vencimento?new Date(x.data_vencimento+'T12:00:00').toLocaleDateString('pt-BR'):'—')+'</td><td>'+brl(x.valor)+'</td><td><span class="'+(x.status==='pago'?'pos':x.status==='atrasado'?'neg':'mu')+'">'+(x.status==='pago'?'Paga':x.status==='atrasado'?'Atrasada':'Pendente')+'</span></td></tr>').join('');
    return '<section class="card" style="margin:10px 0;padding:16px"><div class="row" style="justify-content:space-between"><div><small class="mu">'+natureza+'</small><h3 style="margin:3px 0">'+esc(base.descricao)+'</h3></div><b>'+pagas.length+'/'+totalParcelas+' pagas</b></div><div class="track" style="height:8px;margin:10px 0"><i style="width:'+pct+'%"></i></div><div class="grid2"><div><small class="mu">Valor registrado</small><div><b>'+brl(totalRegistrado)+'</b></div></div><div><small class="mu">Saldo das parcelas em aberto</small><div><b class="neg">'+brl(saldo)+'</b></div></div><div><small class="mu">Parcelas cadastradas</small><div><b>'+lista.length+' de '+totalParcelas+'</b></div></div><div><small class="mu">Próximo vencimento</small><div><b>'+(proxima?.data_vencimento?new Date(proxima.data_vencimento+'T12:00:00').toLocaleDateString('pt-BR'):'Nenhum pendente')+'</b></div></div></div><details style="margin-top:12px"><summary style="cursor:pointer;color:#c8c5ff">Ver todas as parcelas</summary><div class="scroll" style="margin-top:8px"><table style="min-width:0"><thead><tr><th>Parcela</th><th>Vencimento</th><th>Valor</th><th>Status</th></tr></thead><tbody>'+linhas+'</tbody></table></div></details></section>';
  }).join('');
  const html='<div class="modal cf-compromissos-modal"><div class="card box" style="max-width:900px;max-height:88vh;overflow:auto;padding:20px"><div class="row" style="justify-content:space-between"><div><small class="mu">VISÃO GERAL</small><h2 style="margin:2px 0">Compromissos e parcelas</h2><p class="mu" style="margin:0">Acompanhe o que já foi pago, o que falta e os próximos vencimentos.</p></div><button class="sec" data-act="fecharcompromissos">Fechar</button></div>'+(cards||'<p class="mu" style="padding:20px 0">Ainda não há compras parceladas ou financiamentos cadastrados.</p>')+'<p class="mu" style="font-size:12px">O saldo considera as parcelas cadastradas que ainda não foram marcadas como pagas. Se uma prestação tiver valor variável, ajuste o valor de cada mês na planilha.</p></div></div>';
  $('#app').insertAdjacentHTML('beforeend',html);
}
function catOpts(tipo,sel){
  const l=S.cats.filter(c=>c.tipo===tipo);const pais=l.filter(c=>!c.parent_id);
  return '<option value="">—</option>'+pais.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.nome)}</option>`+
    l.filter(c=>c.parent_id===p.id).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>— ${esc(c.nome)}</option>`).join('')).join('');
};

function mobileSmartContext(){
  const lanc=Array.isArray(S.lanc)?S.lanc:[];
  const hoje=new Date();
  const hojeIso=hoje.toISOString().slice(0,10);
  const limiteIso=new Date(hoje.getTime()+7*86400000).toISOString().slice(0,10);
  const receitas=lanc.filter(x=>x.tipo==='receita').reduce((a,x)=>a+Number(x.valor||0),0);
  const despesas=lanc.filter(x=>x.tipo==='despesa').reduce((a,x)=>a+Number(x.valor||0),0);
  const abertas=lanc.filter(x=>x.tipo==='despesa'&&x.status!=='pago');
  const atrasadas=abertas.filter(x=>x.status==='atrasado'||(x.data_vencimento&&x.data_vencimento<hojeIso));
  const proximas=abertas.filter(x=>x.data_vencimento&&x.data_vencimento>=hojeIso&&x.data_vencimento<=limiteIso)
    .sort((a,b)=>String(a.data_vencimento).localeCompare(String(b.data_vencimento)));
  const categorias={};
  lanc.filter(x=>x.tipo==='despesa').forEach(x=>{
    const categoria=S.cats.find(c=>c.id===x.categoria_id);
    const nome=categoria?categoria.nome:'Sem categoria';
    categorias[nome]=(categorias[nome]||0)+Number(x.valor||0);
  });
  const maior=Object.entries(categorias).sort((a,b)=>b[1]-a[1])[0];
  let next;
  if(atrasadas.length){
    next={title:'Revise as contas atrasadas',desc:atrasadas.length+' lançamento(s) precisam de atenção antes de planejar novos gastos.',go:'planilha'};
  }else if(proximas.length){
    next={title:'Confira os próximos vencimentos',desc:proximas.length+' lançamento(s) vencem nos próximos 7 dias.',go:'planilha'};
  }else if(!lanc.length){
    next={title:'Comece pelo primeiro lançamento',desc:'Registre uma receita ou despesa para o Copiloto começar a organizar seu mês.',go:'planilha'};
  }else if(despesas>receitas&&receitas>0){
    next={title:'Compare entradas e saídas',desc:'As despesas registradas estão acima das receitas deste mês. Vale revisar os lançamentos.',go:'checape'};
  }else{
    next={title:'Continue acompanhando',desc:'Não há alertas de vencimento nos próximos 7 dias. Use o Planejamento quando quiser organizar objetivos.',go:'plan'};
  }
  const saldo=receitas-despesas;
  const metric=(label,value,sub,cls)=>'<div class="cf-mobile-balance-metric"><small>'+label+'</small><b class="'+(cls||'')+'">'+value+'</b><span>'+sub+'</span></div>';
  const status=atrasadas.length?'Atenção em contas atrasadas':proximas.length?'Próximos vencimentos':'Mês em acompanhamento';
  return '<section class="cf-mobile-v025" aria-label="Resumo inteligente do mês">'+
    '<div class="cf-mobile-balance">'+
      '<div class="cf-mobile-balance-head"><div><span class="cf-mobile-kicker">RESUMO DO MÊS</span><b>'+esc(status)+'</b></div><span class="cf-mobile-count">'+lanc.length+' movimentações</span></div>'+
      '<div class="cf-mobile-balance-value"><small>Saldo registrado</small><strong class="'+(saldo>=0?'pos':'neg')+'">'+brl(saldo)+'</strong></div>'+
      '<div class="cf-mobile-balance-metrics">'+
        metric('Receitas',brl(receitas),'registradas','pos')+
        metric('Despesas',brl(despesas),'registradas','neg')+
        metric('Em aberto',String(abertas.length),'lançamento(s)',abertas.length?'neg':'pos')+
      '</div>'+
    '</div>'+
    '<div class="cf-mobile-command" aria-label="Ações rápidas">'+
      '<button type="button" data-act="mobileadd" '+(canEdit()&&mesAberto()?'':'disabled')+'><span>＋</span><b>Adicionar</b><small>lançamento</small></button>'+
      '<button type="button" data-act="view" data-v="checape"><span>✓</span><b>Checape</b><small>revisar mês</small></button>'+
      '<button type="button" data-act="mobilemore"><span>⋯</span><b>Mais</b><small>ferramentas</small></button>'+
    '</div>'+
    '<div class="cf-mobile-insight">'+
      '<div class="cf-mobile-insight-copy"><span class="cf-mobile-kicker">PRÓXIMO PASSO</span><b>'+esc(next.title)+'</b><p>'+esc(next.desc)+'</p></div>'+
      '<button type="button" class="cf-mobile-insight-action" data-act="smartgo" data-v="'+next.go+'">Abrir →</button>'+
    '</div>'+
    (maior?'<div class="cf-mobile-pattern"><span>Maior categoria</span><b>'+esc(maior[0])+'</b><small>'+brl(maior[1])+' em despesas registradas</small></div>':'')+

/*PARSER*/
const norm=t=>String(t??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const MES3=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const GRUPOS={'cartoes de credito':'cartoes','retirada mensal':'retirada','fixas / financiamentos':'fixas','outras / variaveis':'variaveis'};
function parseMoneyCell(raw){
  if(typeof raw==='number')return Number.isFinite(raw)?raw:0;
  let v=String(raw??'').trim().replace(/R\$/gi,'').replace(/\s/g,'');
  if(!v)return 0;
  if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');
  else if((v.match(/\./g)||[]).length>1)v=v.replace(/\./g,'');
  const n=Number(v);return Number.isFinite(n)?n:0;
}
function parseDateCell(raw){
  if(raw==null||raw==='')return null;
  if(raw instanceof Date&&!Number.isNaN(raw.getTime()))return raw.getFullYear()+'-'+String(raw.getMonth()+1).padStart(2,'0')+'-'+String(raw.getDate()).padStart(2,'0');
  if(typeof raw==='number'&&window.XLSX?.SSF?.parse_date_code){
    const d=XLSX.SSF.parse_date_code(raw);if(d?.y&&d?.m&&d?.d)return d.y+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
  }
  const v=String(raw).trim();let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=v.match(/^(\d{1,2})[\/. -](\d{1,2})[\/. -](\d{4})$/);
  if(m)return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  return null;
}
function parseMonthCell(raw){
  if(raw==null||raw==='')return null;
  if(typeof raw==='number'&&Number.isInteger(raw)&&raw>=1&&raw<=12)return raw;
  const v=norm(raw);
  const nomes=['janeiro','fevereiro','marco','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const idx=nomes.findIndex((n,i)=>new RegExp('^('+n+'|'+MES3[i]+')(?:$|[\\s/.-])').test(v));
  if(idx>=0)return idx+1;
  const m=v.match(/^(\d{1,2})(?:[\/.-]\d{4})?$/)||v.match(/^\d{4}[\/.-](\d{1,2})$/);
  if(m){const n=+(m[1]||m[2]);if(n>=1&&n<=12)return n;}
  const d=parseDateCell(raw);return d?+d.slice(5,7):null;
}
function parseYearCell(raw){
  const m=String(raw??'').match(/(?:19|20)\d{2}/);return m?+m[0]:null;
}
function parseTabularData(rows,fallbackMonth=null,fallbackYear=null){
  const hi=rows.findIndex(r=>r.some(c=>norm(c).startsWith('valor'))&&r.some(c=>norm(c).startsWith('descri')||norm(c)==='item'));
  if(hi<0)return null;
  const h=rows[hi].map(norm),ix=(...keys)=>h.findIndex(x=>keys.some(k=>x===k||x.startsWith(k)));
  const iv=ix('valor'),id=ix('descri','item'),it=ix('tipo'),ic=ix('categoria'),is=ix('status','situa');
  const idateV=ix('vencimento','data'),im=ix('mes','competencia','referencia'),iy=ix('ano'),inat=ix('natureza compromisso','tipo de compromisso','tipo compromisso','natureza');
  if(iv<0||id<0)return null;
  const grupos=new Map();
  for(const r of rows.slice(hi+1)){
    const descricao=String(r[id]??'').trim(),valor=parseMoneyCell(r[iv]);
    if(!descricao||descricao.length>160||!(valor>0))continue;
    const data=idateV>=0?parseDateCell(r[idateV]):null;
    const mes=(im>=0?parseMonthCell(r[im]):null)||(data?+data.slice(5,7):null)||fallbackMonth;
    const ano=(iy>=0?parseYearCell(r[iy]):null)||(im>=0?parseYearCell(r[im]):null)||(data?+data.slice(0,4):null)||fallbackYear;
    if(!mes)continue;
    const chave=(ano||'sem-ano')+'-'+String(mes).padStart(2,'0');
    if(!grupos.has(chave))grupos.set(chave,{mes,ano,itens:[],receita:0});
    const tipo=it>=0&&norm(r[it]).startsWith('receita')?'receita':'despesa';
    const categoriaNome=ic>=0?String(r[ic]??'').trim():'';
    const categoria=S.cats.find(c=>c.tipo===tipo&&norm(c.nome)===norm(categoriaNome));
    const st=is>=0?norm(r[is]):'pendente';
    const status=['pago','atrasado'].includes(st)?st:'pendente';
    const pm=String(r.find(v=>/\d+\s*(?:de|\/)\s*\d+/i.test(String(v??'')))??'').match(/(\d+)\s*(?:de|\/)\s*(\d+)/i);
    const ipa=ix('parcela atual','numero parcela','número parcela'),ipt=ix('total parcelas','parcelas total','qtd parcelas','quantidade parcelas');
    const pa=ipa>=0?Number(r[ipa]):(pm?+pm[1]:null),pt=ipt>=0?Number(r[ipt]):(pm?+pm[2]:null);
    const naturezaRaw=inat>=0?norm(r[inat]):'';
    const naturezaComp=naturezaRaw.startsWith('financi')||naturezaRaw.startsWith('prest')||naturezaRaw.startsWith('emprest')?'financiamento':'compra';
    grupos.get(chave).itens.push({grupo:tipo==='receita'?'receita':(categoria?.grupo||'variaveis'),descricao,valor,
      categoria_id:categoria?.id||null,data_vencimento:data,status,
      parcela_atual:Number.isInteger(pa)&&pa>0?pa:null,parcelas_total:Number.isInteger(pt)&&pt>0?pt:null,
      natureza_compromisso:naturezaComp});
  }
  return [...grupos.values()];
}
function parseSheetRows(name,rows){
  const m=norm(name).match(/^(janeiro|jan|fevereiro|fev|marco|mar|abril|abr|maio|mai|junho|jun|julho|jul|agosto|ago|setembro|set|outubro|out|novembro|nov|dezembro|dez)(?=[\s\d\/_-]|$)\s*[\/_-]?\s*(\d{4})?/);
  if(!m)return null;
  const mes=MES3.indexOf(m[1].slice(0,3))+1,ano=m[2]?+m[2]:null;
  const header=rows.some(r=>r.some(c=>norm(c).startsWith('valor'))&&r.some(c=>norm(c).startsWith('descri')||norm(c)==='item'));
  if(header)return parseTabularData(rows,mes,ano)||[];
  const out={mes,ano,itens:[],receita:0};
  for(const r of rows){
    const a=norm(r[0]);
    if(a.startsWith('receita prevista')){const v=parseMoneyCell(r[2]);if(v>0)out.receita=v;continue}
    const g=GRUPOS[a];if(!g)continue;
    const v=parseMoneyCell(r[2]);if(!(v>0))continue;
    const pm=String(r[3]??'').match(/(\d+)\s*(?:de|\/)\s*(\d+)/i);
    out.itens.push({grupo:g,descricao:String(r[1]??'').trim(),valor:v,parcela_atual:pm?+pm[1]:null,parcelas_total:pm?+pm[2]:null,obs:r[4]?String(r[4]):null});
  }
  return out;
}
function parseGeneric(rows){
  const meses=parseTabularData(rows,null,null);
  return meses?.length?meses:null;
}

  mountMobileCompanion();
  document.documentElement.dataset.cfReady='1';

function catPara(grupo,desc){
  const d=norm(desc),AL={netflix:'streaming',spotify:'streaming',prestacao:'aluguel/financiamento'};
  const pool=S.cats.filter(c=>c.grupo===grupo&&c.tipo===(grupo==='receita'?'receita':'despesa'));
  for(const k in AL)if(d.includes(k)){const c=pool.find(c=>norm(c.nome)===AL[k]);if(c)return c.id}
  const hit=pool.filter(c=>norm(c.nome).length>2&&(d.includes(norm(c.nome))||norm(c.nome).includes(d))).sort((a,b)=>b.nome.length-a.nome.length)[0];
  if(hit)return hit.id;
  const def={fixas:'Moradia',cartoes:'Cartão de crédito',retirada:'Retirada mensal',variaveis:'Outros',receita:'Salário'}[grupo];
  return(S.cats.find(c=>c.nome===def&&!c.parent_id)||{}).id||null;
}

async function lerArquivo(file){
  try{
    await ensureXlsx();
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const meses=[];
    for(const n of wb.SheetNames){
      if(norm(n)==='instrucoes')continue;
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null,raw:true});
      const p=parseSheetRows(n,rows);
      if(Array.isArray(p))meses.push(...p.filter(m=>m.itens.length||m.receita));
      else if(p){if(p.itens.length||p.receita)meses.push(p)}
      else{
        const g=parseGeneric(rows);
        if(g)meses.push(...g);
      }
    }
    if(!meses.length)return toast('Não encontrei lançamentos com mês, descrição e valor. Inclua uma coluna Mês (ou uma data de vencimento) na planilha.',1);
    const agrupados=new Map();
    meses.forEach(m=>{
      if(!m.ano)m.ano=S.ano.ano;
      const chave=m.ano+'-'+String(m.mes).padStart(2,'0');
      if(!agrupados.has(chave))agrupados.set(chave,{mes:m.mes,ano:m.ano,itens:[],receita:0});
      const destino=agrupados.get(chave);
      destino.itens.push(...(m.itens||[]));destino.receita+=Number(m.receita)||0;
    });
    S.imp=[...agrupados.values()].sort((a,b)=>a.ano-b.ano||a.mes-b.mes);render();
  }catch(err){console.error('Falha ao ler planilha:',err);toast('Não consegui ler esse arquivo: '+(err?.message||'formato inválido'),1)}
}

async function importar(){
  if(S.importando)return;

  S.importando=true;
  document.querySelectorAll('.modal button').forEach(x=>x.disabled=true);
  const modo=$('#imp_modo')?.value||'mesclar';let ins=0,ja=0;const pul=[];let primeiroImportado=null;
  try{
    for(const m of S.imp){
      try{
        const mid=await q(sb.rpc('garantir_mes',{p_fam:S.fam.id,p_ano:m.ano,p_mes:m.mes}));
        const itens=[];
        if(m.receita)itens.push({tipo:'receita',descricao:'Receita prevista',valor:m.receita,categoria_id:catPara('receita','Receita prevista'),status:'pendente'});
        m.itens.forEach(i=>{
          const tipo=i.grupo==='receita'?'receita':'despesa';
          itens.push({tipo,descricao:i.descricao,valor:i.valor,categoria_id:i.categoria_id||catPara(i.grupo,i.descricao),
            data_vencimento:i.data_vencimento||null,status:i.status||'pendente',
            parcela_atual:i.parcela_atual,parcelas_total:i.parcelas_total,natureza_compromisso:i.natureza_compromisso||'compra',observacao:i.obs||null});
        });
        if(!itens.length){pul.push(MN[m.mes-1]+' '+m.ano+': nenhum lançamento reconhecido');continue}
        const{data,error}=await sb.rpc('importar_itens',{p_mes:mid,p_itens:itens,p_modo:modo});
        if(error){pul.push(MN[m.mes-1]+' '+m.ano+': '+error.message);continue}
        const resultado=Array.isArray(data)?data[0]:data;
        ins+=Number(resultado?.inseridos)||0;ja+=Number(resultado?.ja_existiam)||0;
        if(!primeiroImportado)primeiroImportado={ano:m.ano,mes:m.mes};
      }catch(err){pul.push(MN[m.mes-1]+' '+m.ano+': '+(err?.message||'falha ao gravar'))}
    }
    S.anos=await q(sb.from('anos').select('*').eq('familia_id',S.fam.id).order('ano'));
    if(primeiroImportado){
      S.ano=S.anos.find(x=>x.ano===primeiroImportado.ano)||S.ano;
      await loadAno(primeiroImportado.mes);
    }else await loadMes();
    toast(ins+' lançamento(s) novo(s)'+(ja?' · '+ja+' já existiam':'')+(pul.length?' · '+pul.slice(0,3).join(' | '):'')+(pul.length>3?' · e mais '+(pul.length-3)+' erro(s)':''));
  }catch(err){
    console.error('Falha na importação:',err);
    toast('A importação não foi concluída: '+(err?.message||'erro inesperado'),1);
  }finally{S.importando=false;S.imp=null;render()}
}

function crc16(t){let c=0xFFFF;for(let i=0;i<t.length;i++){c^=t.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(id,v)=>id+String(v.length).padStart(2,'0')+v;
function pixPayload(p){
  const conta=tlv('00','BR.GOV.BCB.PIX')+tlv('01',p.chave);
  const base=tlv('00','01')+tlv('01','11')+tlv('26',conta)+tlv('52','0000')+tlv('53','986')+tlv('54',p.valor.toFixed(2))+tlv('58','BR')+tlv('59',p.nome.slice(0,25))+tlv('60',p.cidade.slice(0,15))+tlv('62',tlv('05','***'))+'6304';
  return base+crc16(base);
}

async function enviarCompraGooglePlay(detail){
  const productId=detail?.products?.find(id=>["copiloto_pro_30d","copiloto_max_30d","copiloto_ultra_30d"].includes(id));
  const purchaseToken=detail?.purchaseToken;
  if(!productId||typeof purchaseToken!=="string"||purchaseToken.length<20){
    toast("A Google Play retornou dados incompletos da compra.",1);return;
  }
  if(S.playTokensProcessing.has(purchaseToken))return;
  S.playTokensProcessing.add(purchaseToken);
  try{
    const{data,error}=await sb.functions.invoke("google-play-purchase",{body:{productId,purchaseToken}});
    if(error)throw new Error("Não foi possível validar a compra no servidor.");
    if(data?.error)throw new Error(data.error);
    toast(data?.status==="pendente"?"Compra validada e enviada para aprovação.":"Compra já registrada. Atualizando o acesso.");
    await boot();
  }catch(error){
    toast(error?.message||"Falha ao validar a compra. Abra novamente o aplicativo para tentar de novo.",1);
  }finally{
    S.playTokensProcessing.delete(purchaseToken);
  }
}

    p[f]=v;
    if(f==='status')p.data_pagamento=v==='pago'?new Date().toISOString().slice(0,10):null;
    if(f==='tipo')p.categoria_id=null;
    await q(sb.from('lancamentos').update(p).eq('id',id));await loadMes()}
  }catch(err){console.error('Falha ao salvar alteração:',err);toast('Não foi possível salvar a alteração: '+(err?.message||'erro inesperado'),1)}
});
document.addEventListener('focusout',()=>{if(S.pend)setTimeout(()=>{const a=document.activeElement;if(!(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))atualizarAoVivo()},250)});
document.addEventListener('wheel',()=>{const a=document.activeElement;if(a&&a.type==='number')a.blur()},{passive:true});
document.addEventListener('keydown',e=>{if(e.target.type==='number'&&(e.key==='ArrowUp'||e.key==='ArrowDown'))e.preventDefault();if(e.target.id==='senha'&&e.key==='Enter')document.querySelector('[data-act=entrar]').click();});
</script>

</script><script id="cf-mobile-premium-1-0-19-js">
(function(){
  'use strict';
  function mobileHaptic(){
    try{if(navigator.vibrate)navigator.vibrate(8)}catch(_){}
  }
  function mobileIsPhone(){return window.matchMedia&&window.matchMedia('(max-width:760px)').matches}
  function mobileCommandBar(){
    if(!mobileIsPhone())return;
    const main=document.querySelector('.app-main');
    const period=main&&main.querySelector('.period-toolbar');
    if(!main||!period||main.querySelector('.mobile-command-bar'))return;
    const bar=document.createElement('section');
    bar.className='mobile-command-bar';
    bar.setAttribute('aria-label','Ações rápidas');
    bar.innerHTML=
      '<button type="button" class="primary mobile-command-add" data-act="mobileadd" aria-label="Novo lançamento">＋ Adicionar</button>'+
      '<button type="button" data-act="imp" aria-label="Importar planilha">↑ Importar</button>'+
      '<button type="button" class="mobile-command-more" data-act="mobilemore" aria-label="Mais ações">⋯ Mais</button>'+
      '<div class="mobile-connection-status" aria-live="polite"></div>';
    period.before(bar);
    mobileConnectionStatus();
  }
  function mobileConnectionStatus(){
    document.querySelectorAll('.mobile-connection-status').forEach(el=>{
      const online=navigator.onLine!==false;
      el.classList.toggle('offline',!online);
      el.textContent=online?'Conectado · sincronização disponível':'Sem conexão · verifique a internet';
    });
  }
  function bindMobileTransactionSearch(){
    const table=document.querySelector('.mobile-entry-table');
    if(!table)return;
    const host=table.parentElement;
    if(!host||host.dataset.mobileSearchBound==='1')return;
    host.dataset.mobileSearchBound='1';
    const search=document.createElement('div');
    search.className='mobile-transaction-search';
    search.innerHTML='<input type="search" inputmode="search" autocomplete="off" aria-label="Buscar lançamento" placeholder="Buscar lançamento, categoria ou status"><button type="button" aria-label="Limpar busca">Limpar</button>';
    const count=document.createElement('p');
    count.className='mobile-transaction-count';
    count.setAttribute('aria-live','polite');
    table.before(search,count);
    const input=search.querySelector('input');
    const clear=search.querySelector('button');
    const rows=()=>Array.from(table.querySelectorAll('.mobile-entry-row'));
    const apply=()=>{
      const q=(input.value||'').trim().toLocaleLowerCase('pt-BR');
      let visible=0;
      rows().forEach(row=>{
        const match=!q||row.textContent.toLocaleLowerCase('pt-BR').includes(q);
        const hidden=!match;
        row.hidden=hidden;
        if(match)visible++;
      });
      const total=rows().length;
      count.textContent=q?(visible+' de '+total+' lançamentos'):(total+' lançamentos');
    };
    input.addEventListener('input',apply);
    clear.addEventListener('click',()=>{
      input.value='';
      apply();
      input.focus();
      mobileHaptic();
    });
    apply();
  }
  function bindPremiumInteractions(){
    if(document.documentElement.dataset.mobilePremiumBound==='1')return;
    document.documentElement.dataset.mobilePremiumBound='1';
    document.addEventListener('click',ev=>{
      const btn=ev.target.closest('button,[data-act]');
      if(btn&&!btn.disabled)mobileHaptic();
      const nav=ev.target.closest('[data-mobile-nav]');
      if(nav){
        setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),30);
      }
    },{passive:true});
    window.addEventListener('online',mobileConnectionStatus,{passive:true});
    window.addEventListener('offline',mobileConnectionStatus,{passive:true});
  }
  function enhanceMobileWorkspace(){
    if(!mobileIsPhone())return;
    mobileCommandBar();
    bindMobileTransactionSearch();
    mobileConnectionStatus();
    bindPremiumInteractions();
  }
  if(typeof afterRender==='function'){
    const originalAfterRender=afterRender;
    afterRender=function(){
      originalAfterRender();
      enhanceMobileWorkspace();
    };
  }
  document.addEventListener('DOMContentLoaded',enhanceMobileWorkspace,{once:true});
  window.addEventListener('resize',enhanceMobileWorkspace,{passive:true});
})();
</script>
<script>

function mobileCompanionSpeech(){
  const lanc=Array.isArray(S.lanc)?S.lanc:[];
  const hasData=lanc.length>0;
  const profile=S.tamanduaProfile||{};
  const needs=Array.isArray(profile.melhorar)?profile.melhorar:[];
  const today=new Date().toISOString().slice(0,10);
  const overdue=lanc.some(x=>x.status!=='pago'&&x.data_vencimento&&x.data_vencimento<today);
  const upcoming=lanc.some(x=>x.status!=='pago'&&x.data_vencimento&&x.data_vencimento>=today&&x.data_vencimento<=new Date(Date.now()+7*86400000).toISOString().slice(0,10));

  if(!hasData)return needs.includes('economizar')?'Ainda não tenho dados suficientes. Quando você registrar seus primeiros gastos, vou acompanhar a parte de economia com você.':'Ainda não tenho dados suficientes para analisar este mês.';
  if(overdue)return 'Tem contas atrasadas aqui. Vale conferir antes de planejar novos gastos.';
  if(upcoming)return 'Você tem próximos vencimentos. Vale conferir o que vence primeiro.';
  if(needs.includes('economizar'))return 'Você me contou que quer economizar. Vamos observar seus gastos e acompanhar essa evolução.';
  if(needs.includes('organizar'))return 'Você quer organizar melhor suas finanças. Vamos por partes, sem complicar.';
  if(needs.includes('metas'))return 'Você quer avançar nas suas metas. Vamos acompanhar o que já foi planejado.';
  if(needs.includes('contas'))return 'Você quer acompanhar contas e vencimentos. Vamos deixar isso bem claro por aqui.';

  const speechByView={
    planilha:'Vamos conferir como está seu mês?',
    ano:'Vamos olhar o ano e entender onde seu dinheiro está indo.',
    checape:'Encontrei alguns pontos para você revisar.',
    plan:'Vamos organizar o próximo passo antes de decidir.',
    família:'Aqui você organiza quem participa do seu financeiro.',
    admin:'Vamos revisar as configurações com atenção.'
  };
  return speechByView[S.view]||speechByView.planilha;
}

function mobileCompanionGuide(){
  const companion=document.getElementById('cf-companion');
  if(!companion)return;
  const speech=document.getElementById('cf-companion-speech');
  if(!speech)return;
  speech.hidden=!speech.hidden;
  if(!speech.hidden){
    const face=companion.querySelector('.cf-companion-face');
    if(face){
      face.setAttribute('transform','scale(1.06)');
      setTimeout(()=>face.removeAttribute('transform'),180);
    }
  }
}

function mountMobileCompanion(){
  if(!document.querySelector('.app-main'))return;
  document.getElementById('cf-companion')?.remove();
  document.body.insertAdjacentHTML('beforeend',mobileCompanionMarkup());
}
</script>
