name: Android signed review package

on:
  workflow_dispatch:
  push:
    branches: [feat/android-organized-tamandua-experience]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bundle Supabase WebView runtime
        run: |
          npm install @supabase/supabase-js@2.45.4 --prefix "$RUNNER_TEMP/supabase-runtime" --no-save
          cp "$RUNNER_TEMP/supabase-runtime/node_modules/@supabase/supabase-js/dist/umd/supabase.js" android-app/app/src/main/assets/supabase.js
          test -s android-app/app/src/main/assets/supabase.js

      - name: Validate Android WebView assets
        run: |
          python3 tests/android_webview_assets_test.py
          node --test tests/android_render_test.cjs tests/finance_core_test.cjs tests/tamandua_session_test.cjs tests/tamandua_finance_context_test.cjs tests/android_navigation_test.cjs tests/android_request_scope_test.cjs tests/file_export_test.cjs tests/reminder_plan_test.cjs tests/presentation_rebuild_test.cjs tests/privacy_signup_test.cjs tests/plan_inheritance_test.cjs tests/android_scroll_test.cjs tests/android_startup_recovery_test.cjs

      - name: Test internal tester RLS access
        run: |
          npm install @electric-sql/pglite@0.5.15 --prefix "$RUNNER_TEMP/rls-test" --no-save
          NODE_PATH="$RUNNER_TEMP/rls-test/node_modules" node --test tests/internal_tester_access_test.cjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/copiloto-upload-key.jks"
          test -s "$RUNNER_TEMP/copiloto-upload-key.jks"

      - name: Build signed Play Store bundle and APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/copiloto-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -PcopilotoInternalTest=true testDebugUnitTest bundleRelease assembleRelease

      - name: Verify signed bundle and APK
        working-directory: android-app
        run: |
          BUNDLE="app/build/outputs/bundle/release/app-release.aab"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$BUNDLE"
          test -s "$APK"
          grep -Eq '^[[:space:]]*minSdk[[:space:]]*=[[:space:]]*24[[:space:]]*$' app/build.gradle.kts
          jarsigner -verify -verbose -certs "$BUNDLE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          keytool -printcert -jarfile "$BUNDLE"

      - name: Prepare named deliverables and checksums
        run: |
          mkdir -p signed-package
          cp android-app/app/build/outputs/bundle/release/app-release.aab signed-package/copiloto-financeiro-1.0.44.aab
          cp android-app/app/build/outputs/apk/release/app-release.apk signed-package/copiloto-financeiro-1.0.44.apk
          cd signed-package
          sha256sum copiloto-financeiro-1.0.44.aab copiloto-financeiro-1.0.44.apk > SHA256SUMS.txt

      - name: Upload signed review AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: copiloto-financeiro-1.0.44-assinado
          path: signed-package/*
          if-no-files-found: error
          retention-days: 30

# Generates review artifacts only; does not publish to Google Play.
