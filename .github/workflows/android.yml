name: Android CI
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'android-play-billing.js'
      - 'native-play-billing-bridge.js'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare web assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp android-play-billing.js android/app/src/main/assets/
          cp native-play-billing-bridge.js android/app/src/main/assets/
          cp manifest.webmanifest android/app/src/main/assets/
          cp privacidade.html android/app/src/main/assets/
          cp termos.html android/app/src/main/assets/
          cp excluir-conta.html android/app/src/main/assets/
      - name: Build debug APK and release AAB
        working-directory: android
        run: |
          gradle --no-daemon assembleDebug
          gradle --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: copiloto-financeiro-android
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab