name: Tamandua isolation and intelligence
on:
  pull_request:
    paths:
      - "supabase/functions/tamandua-bot/**"
      - "supabase/migrations/*tamandua*"
      - "tests/tamandua/**"
      - "tests/isolated-db/**"
      - ".github/workflows/tamandua-check.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify backend types and existing bot tests
        run: |
          deno check supabase/functions/tamandua-bot/index.ts
          deno test supabase/functions/tamandua-bot/bot-core.test.ts
      - name: Verify raw response and identity handling
        run: node --test tests/tamandua/response-output.test.mjs
      - name: Install isolated PostgreSQL test engine
        run: npm ci --prefix tests/isolated-db --ignore-scripts --no-audit --no-fund
      - name: Test real RLS with fictitious families
        run: npm test --prefix tests/isolated-db
