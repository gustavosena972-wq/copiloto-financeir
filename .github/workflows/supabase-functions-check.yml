name: Supabase Edge Functions check

on:
  pull_request:
    paths:
      - "supabase/functions/google-play-purchase/**"
      - "supabase/functions/google-play-admin/**"
      - ".github/workflows/supabase-functions-check.yml"
  push:
    branches:
      - android/google-play-preparacao
    paths:
      - "supabase/functions/google-play-purchase/**"
      - "supabase/functions/google-play-admin/**"
      - ".github/workflows/supabase-functions-check.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Google Play purchase function
        run: deno check supabase/functions/google-play-purchase/index.ts
      - name: Type-check Google Play admin function
        run: deno check supabase/functions/google-play-admin/index.ts
