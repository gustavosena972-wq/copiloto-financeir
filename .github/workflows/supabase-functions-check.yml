name: Supabase Edge Functions check

on:
  pull_request:
    paths:
      - "supabase/functions/autenticacao-usuario/**"
      - "supabase/functions/google-play-purchase/**"
      - "supabase/functions/google-play-admin/**"
      - "supabase/functions/_shared/**"
      - "supabase/tests/**"
      - ".github/workflows/supabase-functions-check.yml"
  push:
    branches:
      - main
      - android/google-play-preparacao
    paths:
      - "supabase/functions/autenticacao-usuario/**"
      - "supabase/functions/google-play-purchase/**"
      - "supabase/functions/google-play-admin/**"
      - "supabase/functions/_shared/**"
      - "supabase/tests/**"
      - ".github/workflows/supabase-functions-check.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test shared request security helpers
        run: deno test supabase/functions/_shared/security.test.ts
      - name: Type-check authentication function
        run: deno check supabase/functions/autenticacao-usuario/index.ts
      - name: Type-check Google Play purchase function
        run: deno check supabase/functions/google-play-purchase/index.ts
      - name: Type-check Google Play admin function
        run: deno check supabase/functions/google-play-admin/index.ts
