name: Deploy Web vitrine to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "privacidade.html"
      - "termos.html"
      - "excluir-conta.html"
      - "scripts/build_web_showcase.py"
      - "tests/web_showcase_test.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test institutional web
        run: python3 tests/web_showcase_test.py

      - name: Build institutional web
        run: python3 scripts/build_web_showcase.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
