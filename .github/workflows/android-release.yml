name: Android production release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-release.yml"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD" && exit 1)

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/copiloto-upload-key.jks"
          test -s "$RUNNER_TEMP/copiloto-upload-key.jks"

      - name: Build signed Play Store bundle and APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/copiloto-upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease

      - name: Verify signed bundle and APK
        working-directory: android-app
        run: |
          BUNDLE="app/build/outputs/bundle/release/app-release.aab"
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$BUNDLE"
          test -s "$APK"
          grep -Eq '^[[:space:]]*minSdk[[:space:]]*=[[:space:]]*24[[:space:]]*$' app/build.gradle.kts
          jarsigner -verify -verbose -certs "$BUNDLE" > "$RUNNER_TEMP/aab-signature.log" 2>&1
          jarsigner -verify -verbose -certs "$APK" > "$RUNNER_TEMP/apk-signature.log" 2>&1
          grep -q 'jar verified' "$RUNNER_TEMP/aab-signature.log"
          grep -q 'jar verified' "$RUNNER_TEMP/apk-signature.log"
          keytool -printcert -jarfile "$BUNDLE" | grep 'SHA256:'
          keytool -printcert -jarfile "$APK" | grep 'SHA256:'

      - name: Upload production AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: copiloto-financeiro-play-production
          path: |
            android-app/app/build/outputs/bundle/release/app-release.aab
            android-app/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
