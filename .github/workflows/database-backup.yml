name: Encrypted database backup

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 0'

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Validate required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "Missing SUPABASE_DB_URL repository secret"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "Missing BACKUP_PASSPHRASE repository secret"; exit 1; }

      - name: Create encrypted PostgreSQL dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/copiloto-backup"
          FILE="copiloto-$(date -u +%Y%m%dT%H%M%SZ).dump"
          docker run --rm \
            -e DATABASE_URL="$SUPABASE_DB_URL" \
            -v "$RUNNER_TEMP/copiloto-backup:/backup" \
            postgres:17-alpine \
            sh -lc 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file="/backup/'"$FILE"'"'
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output "$RUNNER_TEMP/copiloto-backup/$FILE.gpg" \
            "$RUNNER_TEMP/copiloto-backup/$FILE"
          rm -f "$RUNNER_TEMP/copiloto-backup/$FILE"

      - name: Upload encrypted backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: copiloto-financeiro-db-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/copiloto-backup/*.gpg
          if-no-files-found: error
          retention-days: 30
