name: Android build

on:
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-build.yml"
      - ".github/workflows/android-play-publish.yml"
      - ".github/workflows/android-release.yml"
      - "tests/android_webview_assets_test.py"
      - "tests/android_render_test.cjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Bundle Supabase WebView runtime
        run: |
          npm install @supabase/supabase-js@2.45.4 --prefix "$RUNNER_TEMP/supabase-runtime" --no-save
          cp "$RUNNER_TEMP/supabase-runtime/node_modules/@supabase/supabase-js/dist/umd/supabase.js" android-app/app/src/main/assets/supabase.js
          test -s android-app/app/src/main/assets/supabase.js

      - name: Validate Android WebView assets
        run: |
          python3 tests/android_webview_assets_test.py
          node --test tests/android_render_test.cjs tests/finance_core_test.cjs tests/tamandua_session_test.cjs tests/tamandua_finance_context_test.cjs tests/android_navigation_test.cjs tests/android_request_scope_test.cjs tests/file_export_test.cjs tests/reminder_plan_test.cjs tests/presentation_rebuild_test.cjs

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Android unit tests
        working-directory: android-app
        run: gradle testDebugUnitTest

      - name: Assemble debug APK
        working-directory: android-app
        run: gradle assembleDebug

      - name: Build release bundle (unsigned unless release signing is configured)
        working-directory: android-app
        run: gradle bundleRelease

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copiloto-financeiro-android-builds
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

# Verify the latest Android 1.0.15 mobile-first workspace commit.
